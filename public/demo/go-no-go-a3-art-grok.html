:root{--paper:#f3f0e8;--sheet:#fbfaf6;--ink:#1c1915;--muted:#5e584e;--line:#e4dccf;--navy:#12263a;--ink2:#f6f1e7;--brass:#5c4314;--soft:#f4ead4;--rule:#c4a15a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.45 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif}
header{background:var(--navy);color:var(--ink2);border-bottom:4px solid var(--rule);padding:8px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}

nav{display:flex;gap:8px;overflow:auto;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-weight:650;padding:0 14px;cursor:pointer}
button.on,#timerbar button{background:var(--navy);color:var(--ink2);border-color:var(--navy)}
button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;overflow:auto;padding:16px}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}.lead{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px}.stats b{font-size:1.5rem;display:block}
.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.unk{font-family:ui-monospace,monospace;font-weight:700;color:var(--brass)}
.row{display:flex;flex-wrap:wrap;gap:8px}.gates{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gate{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px}.gate.here{background:var(--navy);color:var(--ink2)}.gate.veto{background:var(--soft)}
.checks{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}.checks li{border-radius:10px;padding:10px;border:1px solid var(--line)}

.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0}
textarea,pre{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.4 ui-monospace,monospace}

(function () {
  const DATA = window.DESK_DATA;
  const GENESIS = "SESSION-GENESIS";
  const KEY = "wdf-a3-desk-session-v1";
  const app = document.getElementById("app");
  const clocks = document.getElementById("clocks");
  const timerBar = document.getElementById("timerbar");
  let state = load();
  let now = new Date();

  function load() {
    const base = { entries: [], timer: null };
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (raw && Array.isArray(raw.entries)) return { entries: raw.entries, timer: raw.timer || null };
    } catch (e) {}
    return base;
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, "&" + "amp;")
      .replace(/</g, "&" + "lt;")
      .replace(/>/g, "&" + "gt;")
      .replace(/"/g, "&" + "quot;");
  }
  function stamp(d) {
    const utc = d.toISOString().replace(/\.\d{3}Z$/, "Z");
    const parts = Object.fromEntries(
      new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
        timeZoneName: "short",
      })
        .formatToParts(d)
        .map((p) => [p.type, p.value]),
    );
    return {
      et: parts.year + "-" + parts.month + "-" + parts.day + " " + parts.hour + ":" + parts.minute + ":" + parts.second + " " + (parts.timeZoneName || "ET"),
      utc: utc,
    };
  }
  async function sha(message) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(message));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function canonical(e) {
    return JSON.stringify({
      seq: e.seq,
      et: e.et,
      utc: e.utc,
      kind: e.kind,
      pursuitId: e.pursuitId,
      text: e.text,
      seconds: e.seconds,
      prev: e.prevHash,
    });
  }
  async function append(input) {
    const stamped = stamp(new Date());
    const prevHash = state.entries.length ? state.entries[state.entries.length - 1].hash : GENESIS;
    const partial = {
      seq: state.entries.length + 1,
      et: stamped.et,
      utc: stamped.utc,
      kind: input.kind,
      pursuitId: input.pursuitId,
      text: input.text,
      seconds: input.seconds,
      prevHash: prevHash,
    };
    partial.hash = await sha(canonical(partial));
    state.entries.push(partial);
    if (input.kind === "TIMER_START") {
      state.timer = { startedUtc: stamped.utc, pursuitId: input.pursuitId, note: input.text };
    }
    if (input.kind === "TIMER_STOP") state.timer = null;
    save();
    const bad = await verify(state.entries);
    ui.chain = bad.length ? "BREAK at " + bad.join(", ") : "VALID over " + state.entries.length;
    render();
  }
  async function verify(entries) {
    let prev = GENESIS;
    const bad = [];
    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];
      const expect = await sha(canonical(e));
      if (e.seq !== i + 1 || e.prevHash !== prev || e.hash !== expect) bad.push(e.seq);
      prev = expect;
    }
    return bad;
  }
  function pursuit() {
    return DATA.pursuits.find((p) => p.id === ui.pursuitId);
  }
  function holding(id) {
    return DATA.checks[id].filter((c) => c.gate <= 1 && c.status !== "pass");
  }
  function later(id) {
    return DATA.checks[id].filter((c) => c.gate > 1 && c.status !== "pass");
  }
  const ui = {
    view: "board",
    pursuitId: "OPP-001",
    note: "",
    stance: "HOLD",
    rationale: "",
    picked: [],
    discardArmed: false,
    drill: "",
    chain: "",
  };

  function renderClocks() {
    const s = stamp(now);
    clocks.textContent = "";
    clocks.insertAdjacentHTML(
      "beforeend",
      '<div><b>ET</b><span>' + esc(s.et) + "</span></div><div><b>UTC</b><span>" + esc(s.utc) + "</span></div>",
    );
    if (state.timer) {
      const seconds = Math.max(0, Math.floor((now.getTime() - Date.parse(state.timer.startedUtc)) / 1000));
      timerBar.hidden = false;
      timerBar.innerHTML =
        "<span>Timer " +
        esc(state.timer.pursuitId) +
        " · <b>" +
        seconds +
        '</b> seconds</span><button type="button" data-act="stop">Stop and stamp</button>';
    } else timerBar.hidden = true;
  }

  function nav() {
    return ["board", "pursuit", "requests", "ledger", "law", "reading"]
      .map((id) => {
        const label = id[0].toUpperCase() + id.slice(1) + (id === "ledger" && state.entries.length ? " · " + state.entries.length : "");
        return '<button type="button" data-act="nav" data-view="' + id + '"' + (ui.view === id ? ' class="on"' : "") + ">" + label + "</button>";
      })
      .join("");
  }

  function board() {
    const cards = DATA.pursuits
      .map((p) => {
        return (
          '<article class="card"><p class="mono">' +
          p.id +
          "</p><h2>" +
          esc(p.name) +
          '</h2><p>' +
          esc(p.packageName) +
          '</p><p class="unk">Bid due UNKNOWN · Party UNKNOWN</p><p>' +
          holding(p.id).length +
          " open on Gates 0–1 · " +
          later(p.id).length +
          ' already open later</p><button type="button" data-act="open" data-id="' +
          p.id +
          '">Open ' +
          esc(p.name) +
          "</button></article>"
        );
      })
      .join("");
    return (
      '<p class="lead">A3 runs the A1 rules in this browser. It does not write the master. Scroll for every pursuit, request, and log entry.</p>' +
      '<div class="stats"><div><b>3</b><span>At Gate 1</span></div><div><b>0</b><span>Decisions</span></div><div><b>8</b><span>Unfiled</span></div><div><b>' +
      state.entries.length +
      "</b><span>Session</span></div></div>" +
      cards +
      '<section class="card"><h2>Decisions</h2><p>None on the master. DEC-0001 is a placeholder. A session draft is not DEC-0002.</p></section>'
    );
  }

  function pursuitView() {
    const p = pursuit();
    const checks = DATA.checks[p.id]
      .map((c) => {
        return (
          '<li class="' +
          c.status +
          '"><p class="kicker">Gate ' +
          c.gate +
          " · " +
          c.status +
          " · " +
          c.id +
          "</p><strong>" +
          esc(c.title) +
          "</strong><p>" +
          esc(c.detail) +
          "</p></li>"
        );
      })
      .join("");
    const gates = DATA.gates
      .map((g) => '<div class="gate' + (g.n === 1 ? " here" : g.n === 0 ? " veto" : "") + '"><b>' + g.n + "</b><span>" + esc(g.name) + "</span></div>")
      .join("");
    return (
      '<div class="row">' +
      DATA.pursuits
        .map(
          (item) =>
            '<button type="button" data-act="pick" data-id="' +
            item.id +
            '"' +
            (item.id === p.id ? ' class="on"' : "") +
            ">" +
            esc(item.name) +
            "</button>",
        )
        .join("") +
      "</div><article class=\"card\"><p class=\"mono\">" +
      p.id +
      "</p><h2>" +
      esc(p.name) +
      "</h2><p>" +
      esc(p.packageName) +
      "</p><p>" +
      esc(p.nextAction) +
      "</p>" +
      (p.lane ? "<p>" + esc(p.lane) + "</p>" : "") +
      '<p class="unk">Bid due UNKNOWN · RFI UNKNOWN · Owner / GC / CM UNKNOWN</p></article><div class="gates">' +
      gates +
      '</div><section class="card"><h2>Why it cannot leave Gate 1</h2><ul class="checks">' +
      checks +
      '</ul><button type="button" data-act="block">Record blocked advance</button></section>' +
      '<section class="card"><h2>Session timer</h2><p>Seconds only. TIME-0001 stays a 337-second interval.</p><button type="button" data-act="start"' +
      (state.timer ? " disabled" : "") +
      '>Start timer</button></section><section class="card"><h2>Preparer note</h2><p>A note does not change UNKNOWN.</p><textarea id="note" rows="3" placeholder="Not a fact about the job."></textarea><button type="button" data-act="note">Stamp note</button></section>' +
      '<section class="card"><h2>Session stance — not a decision</h2><div class="row">' +
      ["GO", "NO-GO", "HOLD"]
        .map((s) => '<button type="button" data-act="stance" data-stance="' + s + '"' + (ui.stance === s ? ' class="on"' : "") + ">" + s + "</button>")
        .join("") +
      '</div><textarea id="why" rows="3" placeholder="Why, in terms of the open stops."></textarea><button type="button" data-act="file">File as session draft</button></section>'
    );
  }

  function letter() {
    const selected = DATA.dataRequests.filter((d) => ui.picked.indexOf(d.id) >= 0);
    const lines = selected.length
      ? selected.map((d) => "- " + d.id + " " + d.group + ". If authorized: " + d.extract + ".").join("\n")
      : "- (none selected)";
    return [
      "To: Mark Makary, SVP",
      "From: George Oktem, Senior Estimator",
      "Re: Gate 0 — permission to handle, before any extract",
      "",
      "This is a question, not a data pull.",
      "No extract should move until handling is authorized in writing.",
      "",
      "If you authorize handling, the minimum extracts to discuss are:",
      lines,
      "",
      "Pursuits still at Gate 1. Every bid due reads UNKNOWN. No Go/No-Go is recorded.",
      "Stamping this draft does not change DR status. Every row remains NOT REQUESTED.",
    ].join("\n");
  }

  function requests() {
    const rows = DATA.dataRequests
      .map((d) => {
        const on = ui.picked.indexOf(d.id) >= 0;
        return (
          '<label class="card checkline"><input type="checkbox" data-act="dr" data-id="' +
          d.id +
          '"' +
          (on ? " checked" : "") +
          "><span><b>" +
          d.id +
          " · NOT REQUESTED</b><br>" +
          esc(d.group) +
          "<br><span class=\"muted\">" +
          esc(d.extract) +
          "</span></span></label>"
        );
      })
      .join("");
    return (
      '<section class="card"><h2>Ask Mark before any extract</h2><p>Packing a question does not file the request.</p></section>' +
      rows +
      '<section class="card"><h2>Letter preview</h2><pre>' +
      esc(letter()) +
      '</pre><button type="button" data-act="packet"' +
      (ui.picked.length ? "" : " disabled") +
      ">Stamp draft into the session ledger</button></section>"
    );
  }

  function ledger() {
    const published = DATA.publishedLog
      .map((e) => {
        return (
          '<article class="card' +
          (e.served ? "" : " receipt") +
          '"><p class="mono">' +
          e.id +
          " · " +
          (e.served ? "In the served snapshot" : "Receipt — not in the served HTML") +
          "</p><strong>" +
          esc(e.event) +
          "</strong><p>" +
          esc(e.detail) +
          '</p><p class="mono">' +
          esc(e.hash || e.hashLabel) +
          "</p></article>"
        );
      })
      .join("");
    const sessionRows = state.entries
      .map((e) => {
        return (
          '<li><p class="mono">SESS-' +
          String(e.seq).padStart(4, "0") +
          " · " +
          e.kind +
          "</p><p>" +
          esc(e.text) +
          '</p><p class="mono">' +
          esc(e.hash) +
          "</p></li>"
        );
      })
      .join("");
    return (
      '<section class="card"><h2>Two ledgers</h2><p>Published hashes are recorded, not recomputed. Snapshot SHA-256 ' +
      esc(DATA.registry.snapshotSha256) +
      " (" +
      DATA.registry.snapshotBytes +
      " bytes). PR #" +
      DATA.registry.prNumber +
      " said " +
      DATA.registry.prBodyBytesClaim +
      ' bytes. Prefix matches. Size does not.</p><p class="mono">' +
      esc(ui.chain || "Session chain checks when this tab opens.") +
      '</p><button type="button" data-act="export"' +
      (state.entries.length ? "" : " disabled") +
      '>Export packet</button> <button type="button" data-act="discard">Discard local session</button></section>' +
      published +
      '<section class="card"><h2>Session chain</h2><ul>' +
      (sessionRows || "<li>Empty. The first stamp starts it.</li>") +
      '</ul></section><section class="card"><h2>Tamper drill</h2><button type="button" data-act="drill">Run tamper drill</button><p>' +
      esc(ui.drill) +
      "</p></section>"
    );
  }

  function law() {
    const rules = [
      ["01 Append-only", "Session stamps append. Discard throws away this browser pad. It is not a registry correction."],
      ["02 Dual timestamps", "Eastern and UTC at the click. LOG-0008’s stamp was not in the report, so it stays UNKNOWN."],
      ["03 Hash chain", "Session entries are sealed here. Published digests stay recorded."],
      ["04 Timer only", "Work time is stop minus start, in seconds. The 337 seconds stay an interval."],
      ["05 Evidence", "Snapshot facts stay Declared or Verified as recorded. Notes say they are not evidence."],
      ["06 UNKNOWN", "No field turns a guess into a bid date, a party, a margin, or a score."],
    ];
    return rules
      .map((r) => '<article class="card"><h2>' + r[0] + "</h2><p>" + r[1] + "</p></article>")
      .join("");
  }

  function reading() {
    return (
      '<article class="card"><h2>What works</h2><p>The three pursuits, the vetoes, the unfiled requests, the empty decision book, the published log through LOG-0007, and the LOG-0008 receipt as a prefix only. A blocked advance, a timer, a Mark-first draft, and a session chain you can verify.</p></article>' +
      '<article class="card"><h2>What this is not</h2><p>Not the private master. Not a bid. Not a place an UNKNOWN becomes a fact. The public A1 page is still the seven-entry snapshot. This route is the instrument beside it.</p></article>'
    );
  }

  function render() {
    document.getElementById("nav").innerHTML = nav();
    const body = ui.view === "board" ? board() : ui.view === "pursuit" ? pursuitView() : ui.view === "requests" ? requests() : ui.view === "ledger" ? ledger() : ui.view === "law" ? law() : reading();
    app.innerHTML = body;
    const note = document.getElementById("note");
    const why = document.getElementById("why");
    if (note) note.value = ui.note;
    if (why) why.value = ui.rationale;
    renderClocks();
  }

  document.body.addEventListener("click", function (event) {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "nav") ui.view = el.getAttribute("data-view");
    if (act === "open") {
      ui.pursuitId = el.getAttribute("data-id");
      ui.view = "pursuit";
    }
    if (act === "pick") ui.pursuitId = el.getAttribute("data-id");
    if (act === "stance") ui.stance = el.getAttribute("data-stance");
    if (act === "block") {
      const p = pursuit();
      const ids = holding(p.id).map((c) => c.id).join(", ");
      void append({
        kind: "ADVANCE_BLOCKED",
        pursuitId: p.id,
        seconds: null,
        text: p.id + " " + p.name + " stays at Gate 1. Not a decision. Open on Gates 0–1: " + ids + ".",
      });
      return;
    }
    if (act === "start") {
      if (state.timer) return;
      const p = pursuit();
      void append({
        kind: "TIMER_START",
        pursuitId: p.id,
        seconds: null,
        text: "Timer started on " + p.id + ". Work time will be the stop minus the start, in seconds.",
      });
      return;
    }
    if (act === "stop" && state.timer) {
      const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(state.timer.startedUtc)) / 1000));
      void append({
        kind: "TIMER_STOP",
        pursuitId: state.timer.pursuitId,
        seconds: seconds,
        text: "Timer stopped after " + seconds + " seconds. Counted by the clock, not from memory.",
      });
      return;
    }
    if (act === "note") {
      const value = (document.getElementById("note").value || "").trim();
      if (value.length < 8) return;
      ui.note = "";
      void append({
        kind: "PREPARER_NOTE",
        pursuitId: pursuit().id,
        seconds: null,
        text: pursuit().id + " preparer note — not evidence, does not change UNKNOWN. " + value,
      });
      return;
    }
    if (act === "file") {
      const value = (document.getElementById("why").value || "").trim();
      if (value.length < 20) return;
      ui.rationale = "";
      void append({
        kind: "STANCE_DRAFTED",
        pursuitId: pursuit().id,
        seconds: null,
        text: pursuit().id + " session draft " + ui.stance + ". Not DEC-0002. Master decisions remain 0. Rationale: " + value,
      });
      return;
    }
    if (act === "packet") {
      if (!ui.picked.length) return;
      void append({ kind: "PACKET_DRAFTED", pursuitId: null, seconds: null, text: letter() });
      return;
    }
    if (act === "export") {
      const blob = new Blob(
        [
          JSON.stringify(
            {
              desk: "A3",
              warning: "SESSION PACKET — NOT A MASTER ENTRY. Do not file this as LOG or DEC.",
              registry: DATA.registry.id,
              entries: state.entries,
            },
            null,
            2,
          ),
        ],
        { type: "application/json" },
      );
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "a3-session-not-a-master-entry.json";
      a.click();
    }
    if (act === "discard") {
      if (!ui.discardArmed) {
        ui.discardArmed = true;
        ui.chain = "Press discard again to erase this browser pad. The master is not touched.";
      } else {
        state = { entries: [], timer: null };
        ui.discardArmed = false;
        save();
      }
    }
    if (act === "dr") return;
    if (act === "drill") {
      void (async function () {
        const samples = ["Drill row. Boundary held.", "Drill row. Bid due still UNKNOWN.", "Drill row. No decision taken."];
        const rows = [];
        let prev = GENESIS;
        for (let i = 0; i < samples.length; i++) {
          const partial = {
            seq: i + 1,
            et: "2026-10-29 12:00:00 EDT",
            utc: "2026-10-29T16:00:00Z",
            kind: "PREPARER_NOTE",
            pursuitId: null,
            text: samples[i],
            seconds: null,
            prevHash: prev,
          };
          partial.hash = await sha(canonical(partial));
          rows.push(partial);
          prev = partial.hash;
        }
        const intact = await verify(rows);
        const broken = rows.map((row, index) => (index === 1 ? Object.assign({}, row, { text: row.text + " [altered]" }) : row));
        const bad = await verify(broken);
        ui.drill = "Intact: " + (intact.length ? "BREAK" : "VALID") + ". Altered middle row: BREAK at " + bad.join(" and ") + ".";
        render();
      })();
      return;
    }
    render();
  });

  document.body.addEventListener("input", function (event) {
    if (event.target.id === "note") ui.note = event.target.value;
    if (event.target.id === "why") ui.rationale = event.target.value;
  });
  document.body.addEventListener("change", function (event) {
    if (event.target.getAttribute("data-act") !== "dr") return;
    const id = event.target.getAttribute("data-id");
    if (event.target.checked) ui.picked.push(id);
    else ui.picked = ui.picked.filter((item) => item !== id);
    render();
  });

  verify(state.entries).then(function (bad) {
    ui.chain = state.entries.length ? (bad.length ? "BREAK at " + bad.join(", ") : "VALID over " + state.entries.length) : "Empty session chain.";
    if (ui.view === "ledger") render();
  });
  render();
  setInterval(function () {
    now = new Date();
    renderClocks();
  }, 1000);
})();

</script>
</body>
</html>
