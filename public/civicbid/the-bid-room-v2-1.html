<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>The Bid Room v2.1 — Loading</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eae5;color:#15202e}
main{max-width:42rem;padding:2rem;text-align:center}
strong{display:block;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase}
p{line-height:1.55;color:#596472}
.error{color:#a12d21}
@media(prefers-color-scheme:dark){body{background:#12161d;color:#e8ecf2}p{color:#aab5c3}.error{color:#f07b6e}}
</style>
</head>
<body>
<main aria-live="polite">
  <strong>The Bid Room v2.1</strong>
  <p id="status">Loading the complete contractor workflow interface…</p>
</main>
<script>
(async function loadBidRoom(){
  const status=document.getElementById("status");
  const parts=[0,1,2,3].map(i=>`/civicbid/the-bid-room-v2-1.payload.${i}.txt`);
  try{
    const responses=await Promise.all(parts.map(path=>fetch(path,{cache:"no-store"})));
    const failed=responses.find(response=>!response.ok);
    if(failed)throw new Error(`Payload request failed with HTTP ${failed.status}`);
    const encoded=(await Promise.all(responses.map(response=>response.text()))).join("").trim();
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    const byteLength=new TextEncoder().encode(html).byteLength;
    if(byteLength!==84768)throw new Error(`Payload verification failed: expected 84768 bytes, received ${byteLength}`);
    const runtimePatch='<script>(function(){const originalDueInfo=window.dueInfo;const maxActionableDays=730;if(typeof originalDueInfo==="function"){window.dueInfo=function(due){const info=originalDueInfo(due);const date=info&&info.date instanceof Date?info.date:null;const validDate=Boolean(date&&Number.isFinite(date.getTime()));const finiteDays=Boolean(info&&Number.isFinite(info.days));const year=validDate?date.getFullYear():null;const farFuture=finiteDays&&info.days>maxActionableDays;const placeholderYear=year!==null&&year>=2090;if(validDate&&finiteDays&&!farFuture&&!placeholderYear)return info;const sourceDate=validDate?date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}):String(due||"No date published");return Object.assign({},info,{days:null,label:"VERIFY",unit:farFuture||placeholderYear?"placeholder date":"date issue",band:"warm",timeKnown:false,txt:sourceDate+" · verify official deadline",date:null,suspect:true,sourceDueDate:due||null});};dueInfo=window.dueInfo;}let applied=false;const badge=document.getElementById("n-today");if(!badge)return;const apply=function(){if(applied)return;const count=Number.parseInt(badge.textContent.trim(),10);if(!Number.isFinite(count))return;applied=true;if(count===0&&typeof selectTab==="function")selectTab("board");};new MutationObserver(apply).observe(badge,{childList:true,subtree:true,characterData:true});queueMicrotask(apply);})();<\/script>';
    const patchedHtml=html.replace("</body>",runtimePatch+"</body>");
    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(error){
    console.error("Bid Room payload failed",error);
    status.className="error";
    status.textContent="The complete Bid Room interface could not be loaded. Refresh the page or return to the CivicBid bridge.";
  }
})();
</script>
</body>
</html>
