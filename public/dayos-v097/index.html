<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artemis DayOS v0.9.7 — Unified Lens Workspace</title><style>:root{--bg:#071019;--panel:#0d1823;--line:#223345;--text:#eef6ff;--muted:#8fa4b8;--accent:#53c7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#071019ef;border-bottom:1px solid var(--line);padding:12px 16px}.wrap{max-width:1280px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:11px}.badge{font:10px ui-monospace;padding:4px 7px;border:1px solid var(--line);border-radius:99px}nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}button{background:#101d2a;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}button.active{color:#fff;border-color:var(--accent);background:#112638}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin:12px 0}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}.card b{font-size:20px;display:block}.label{font:10px ui-monospace;color:var(--muted);text-transform:uppercase}main{padding:0 16px 28px}.lens{display:none}.lens.active{display:block}.daygrid{display:grid;grid-template-columns:110px repeat(4,1fr);gap:6px}.cell{min-height:90px;border:1px solid var(--line);border-radius:8px;padding:7px;background:#09141e}.phase,.rowlabel{font:10px ui-monospace;color:var(--muted);padding:6px}.entity{margin-top:5px;padding:5px 6px;border-left:2px solid var(--accent);background:#10202e;border-radius:4px;font-size:11px}.cols2{grid-template-columns:1fr 1fr}.timeline{position:relative;height:180px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#08131c}.bar{position:absolute;height:30px;border-radius:5px;background:#173047;border:1px solid #31516d;padding:6px;font-size:10px;white-space:nowrap;overflow:hidden}.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}.map{height:330px;position:relative;overflow:hidden;background:radial-gradient(circle at 60% 40%,#15304a,#08131c 55%);border-radius:9px;border:1px solid var(--line)}.node{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}.edge{position:absolute;height:2px;background:#5cc9ff66;transform-origin:left center}.ledger .item{padding:8px;border-bottom:1px solid var(--line)}.missionhero{font-size:28px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:800px){.kpis,.cols2{grid-template-columns:1fr 1fr}.daygrid{grid-template-columns:72px repeat(4,minmax(120px,1fr));overflow:auto}}</style></head><body><header><div class="wrap"><div class="top"><div><h1>ARTEMIS DAYOS <span style="color:var(--accent)">v0.9.7</span></h1><div class="sub">Unified Lens Workspace · one state bus · pure projections · PUBLIC_SAFE demo</div></div><div><span id="modeBadge" class="badge">LIVE</span> <span id="clock" class="badge">—</span></div></div><nav id="nav"></nav></div></header><main class="wrap"><div class="grid kpis"><div class="card"><span class="label">Selected target</span><b id="kTarget">—</b></div><div class="card"><span class="label">Battery</span><b id="kSoc">—</b></div><div class="card"><span class="label">Next</span><b id="kNext">—</b></div><div class="card"><span class="label">State integrity</span><b>PASS</b></div></div><section id="now" class="lens panel"></section><section id="dayGrid" class="lens panel"></section><section id="mission" class="lens panel"></section><section id="map" class="lens panel"></section><section id="gantt" class="lens panel"></section><section id="ledger" class="lens panel"></section></main><script>const phases=['NIGHT','MORNING','AFTERNOON','EVENING'],layers=['STATE','PLAN','ANCHORS','ACTIONS','BODY','REALITY'];const base=(()=>{let d=new Date();d.setHours(0,0,0,0);return Math.floor(d.getTime()/1000)})();const entities=[{id:'prep',title:'Morning systems check',kind:'task',startsAt:base+28800,endsAt:base+30600,rigidity:'SOFT',location:{lat:41.60,lng:-73.97}},{id:'mission',title:'Field Mission Alpha',kind:'mission',startsAt:base+36000,endsAt:base+43200,rigidity:'FIRM',location:{lat:41.59,lng:-73.96}},{id:'anchor',title:'Protected Client Anchor',kind:'anchor',startsAt:base+50400,endsAt:base+54000,rigidity:'HARD',location:{lat:41.57,lng:-73.98}},{id:'debrief',title:'Evidence debrief',kind:'task',startsAt:base+57600,endsAt:base+61200,rigidity:'SOFT',location:{lat:41.61,lng:-73.99}}];const evidence=[{entityId:'mission',kind:'CALENDAR',observedAtSec:base+25200,epistemic:'REPORTED',summary:'Mission schedule loaded'},{entityId:'anchor',kind:'OPERATOR',observedAtSec:base+25560,epistemic:'OBSERVED',summary:'HARD anchor confirmed'}];const params=new URLSearchParams(location.search);const state={activeLens:params.get('lens')||'now',selectedTargetId:params.get('target')||'mission',timeMode:params.get('mode')==='SCRUB'?'SCRUB':'LIVE',scrubAnchorSec:+params.get('scrub')||null,ambientSocPct:86};const lenses=['now','dayGrid','mission','map','gantt','ledger'];function effectiveNow(){return state.timeMode==='SCRUB'&&state.scrubAnchorSec?state.scrubAnchorSec:Math.floor(Date.now()/1000)}function syncUrl(){const p=new URLSearchParams();p.set('lens',state.activeLens);p.set('target',state.selectedTargetId);p.set('mode',state.timeMode);if(state.scrubAnchorSec)p.set('scrub',state.scrubAnchorSec);history.replaceState(null,'','?'+p)}function setLens(x){state.activeLens=x;syncUrl();render()}function selectTarget(id){state.selectedTargetId=id;syncUrl();render()}function phaseFor(s){let h=new Date(s*1000).getHours();return h<6?0:h<12?1:h<18?2:3}function projectNow(){let t=effectiveNow(),active=entities.find(e=>e.startsAt<=t&&e.endsAt>t)||null,next=entities.filter(e=>e.startsAt>t).sort((a,b)=>a.startsAt-b.startsAt)[0]||null;return{t,active,next}}function projectGrid(){let cells=[];for(let r=0;r<6;r++)for(let c=0;c<4;c++)cells.push({r,c,ids:[]});for(const e of entities){let c=phaseFor(e.startsAt),r=e.rigidity==='HARD'?2:e.kind==='task'?3:e.kind==='mission'?1:0;cells[r*4+c].ids.push(e.id)}return cells}function fmt(s){return new Date(s*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function render(){nav.innerHTML=lenses.map(x=>`<button class="${state.activeLens===x?'active':''}" onclick="setLens('${x}')">${x==='dayGrid'?'4×6 GRID':x.toUpperCase()}</button>`).join('');document.querySelectorAll('.lens').forEach(x=>x.classList.remove('active'));document.getElementById(state.activeLens).classList.add('active');let p=projectNow();now.innerHTML=`<div class="label">Tactical Now Strip</div><div class="missionhero">${p.active?.title||'Ambient / transition'}</div><p>${p.next?`Next: <b>${p.next.title}</b> at ${fmt(p.next.startsAt)} · ${Math.max(0,Math.round((p.next.startsAt-p.t)/60))} min`:'No later nodes today.'}</p><div class="actions"><button onclick="state.timeMode='SCRUB';state.scrubAnchorSec=base+46800;syncUrl();render()">Scrub 13:00</button><button onclick="state.timeMode='LIVE';state.scrubAnchorSec=null;syncUrl();render()">LIVE</button></div>`;let cells=projectGrid();dayGrid.innerHTML=`<div class="label">Canonical 4×6 Day Grid</div><div class="daygrid"><div></div>${phases.map(x=>`<div class="phase">${x}</div>`).join('')}${layers.map((l,r)=>`<div class="rowlabel">${l}</div>${[0,1,2,3].map(c=>`<div class="cell">${cells[r*4+c].ids.map(id=>{let e=entities.find(x=>x.id===id);return `<div class="entity" onclick="selectTarget('${id}');setLens('mission')">${e.title}<br><span class="sub">${fmt(e.startsAt)} · ${e.rigidity}</span></div>`}).join('')}</div>`).join('')}`).join('')}</div>`;let target=entities.find(e=>e.id===state.selectedTargetId);mission.innerHTML=target?`<div class="label">Mission Cockpit / Target Lock</div><div class="missionhero">${target.title}</div><p>${target.kind.toUpperCase()} · ${target.rigidity} · ${fmt(target.startsAt)}–${fmt(target.endsAt)}</p><div class="grid cols2"><div class="card"><span class="label">Evidence</span>${evidence.filter(e=>e.entityId===target.id).map(e=>`<p>${e.epistemic} · ${e.summary}</p>`).join('')||'<p class="sub">No target evidence.</p>'}</div><div class="card"><span class="label">Contextual resources</span><p>${target.kind==='mission'?'Field kit · phone · charger · route':'Standard operator kit'}</p><p>${target.rigidity==='HARD'?'Protected: solver may not silently move this anchor.':'Eligible for constraint evaluation.'}</p></div></div>`:'No target';let nodes=entities.filter(e=>e.location);map.innerHTML=`<div class="label">SpatialGraph Projection</div><div class="map">${nodes.map((n,i)=>`<div class="node" title="${n.title}" onclick="selectTarget('${n.id}');setLens('mission')" style="left:${18+i*21}%;top:${25+(i%2)*40}%"></div>`).join('')}</div><p class="sub">PUBLIC_SAFE spatial projection. Canonical targets are shared with Mission and Grid.</p>`;let start=base+21600,end=base+72000,span=end-start,t=effectiveNow();gantt.innerHTML=`<div class="label">Dual-layer Gantt / Scrubber</div><div class="timeline">${entities.map((e,i)=>`<div class="bar" style="top:${15+i*38}px;left:${Math.max(0,(e.startsAt-start)/span*100)}%;width:${Math.max(3,(e.endsAt-e.startsAt)/span*100)}%">${e.title}</div>`).join('')}<div class="playhead" style="left:${Math.max(0,Math.min(100,(t-start)/span*100))}%"></div></div>`;ledger.innerHTML=`<div class="label">Evidence Ledger</div><div class="ledger">${evidence.map(e=>`<div class="item"><b>${entities.find(x=>x.id===e.entityId)?.title}</b><div class="sub">${e.kind} · ${e.epistemic} · ${fmt(e.observedAtSec)}</div><div>${e.summary}</div></div>`).join('')}</div>`;kTarget.textContent=target?.title||'—';kSoc.textContent=state.ambientSocPct+'%';kNext.textContent=p.next?fmt(p.next.startsAt):'—';modeBadge.textContent=state.timeMode;clock.textContent=fmt(effectiveNow())}document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key.toLowerCase()==='l'){state.timeMode='LIVE';state.scrubAnchorSec=null;syncUrl();render()}if(e.key==='ArrowRight'&&state.timeMode==='SCRUB'){state.scrubAnchorSec=(state.scrubAnchorSec||effectiveNow())+(e.shiftKey?900:60);syncUrl();render()}if(e.key==='ArrowLeft'&&state.timeMode==='SCRUB'){state.scrubAnchorSec=(state.scrubAnchorSec||effectiveNow())-(e.shiftKey?900:60);syncUrl();render()}});render();setInterval(()=>{if(state.timeMode==='LIVE')render()},30000);</script></body></html>
