<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ee">
<title>LEVARA L28 · Marlboro Rainbow Financial Twin</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 12% 10%,rgba(247,213,91,.25),transparent 30%),radial-gradient(circle at 88% 14%,rgba(93,163,210,.22),transparent 32%),linear-gradient(145deg,#fffaf4,#edf7ed);font-family:Inter,ui-sans-serif,system-ui;color:#27463a}.loader{width:min(520px,88vw);padding:28px;border:1px solid rgba(53,86,69,.14);border-radius:24px;background:rgba(255,253,249,.88);box-shadow:0 25px 80px rgba(63,91,73,.14);backdrop-filter:blur(18px)}.band{height:5px;border-radius:99px;background:linear-gradient(90deg,#f1c84d,#e88758,#d46f9e,#9277c8,#5fa5d3,#57a778);animation:pulse 1.6s ease-in-out infinite}h1{font-size:24px;margin:22px 0 8px;letter-spacing:-.03em}p{margin:0;color:#687970;line-height:1.55}small{display:block;margin-top:16px;font-family:ui-monospace,monospace;color:#7a8c82}@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="band"></div><h1>Opening the LEVARA L28 Financial Twin</h1><p>Loading the Marlboro Rainbow experience, 5D model, success gates, and interactive cost twin.</p><small id="status">Preparing verified standalone payload…</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support streamed decompression. Use a current Chrome, Edge, Firefox, or Safari release.');
    const files=['payload-01.txt', 'payload-02.txt', 'payload-03.txt', 'payload-04.txt', 'payload-05.txt', 'payload-06.txt', 'payload-07.txt'];
    const pieces=[];
    for(let i=0;i<files.length;i++){
      status.textContent=`Loading experience ${i+1} of ${files.length}…`;
      const response=await fetch(files[i],{cache:'force-cache'});
      if(!response.ok) throw new Error(`Payload part ${i+1} failed with HTTP ${response.status}.`);
      pieces.push((await response.text()).trim());
    }
    status.textContent='Reconstructing interactive model…';
    const binary=atob(pieces.join(''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('Marlboro Rainbow Financial Twin')) throw new Error('Payload integrity check failed.');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);status.textContent=error.message;document.querySelector('.band').style.animation='none';
  }
})();
</script>
</body>
</html>
