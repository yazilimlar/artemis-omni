<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Girih &mdash; Turkish Geometry Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --fg:#e9eef5; --muted:#9aa7b8; --accent:#58C4DD; --teal:#5CD0B3; --gold:#F0AC5F; --red:#FC6255;
  --panel:rgba(17,20,27,.84); --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e1e1e;color:var(--fg);overflow:hidden;overscroll-behavior:none;
  font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- start overlay ---------- */
#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(14,17,24,.42),rgba(8,10,14,.86));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .9s ease,visibility .9s}
#overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
#overlay h1{margin:0 0 6px;font:italic 400 clamp(26px,6.2vw,52px)/1.1 "Latin Modern Roman","CMU Serif",Georgia,"Times New Roman",serif;
  color:#fff;letter-spacing:.01em;text-shadow:0 0 22px rgba(88,196,221,.55)}
#overlay h1 em{color:var(--gold);font-style:italic}
#overlay p{margin:6px auto 26px;max-width:34em;color:#c4cedb;font-size:clamp(13px,3.4vw,16px)}
#startBtn{appearance:none;border:1.5px solid var(--accent);background:rgba(88,196,221,.12);color:#fff;
  width:min(46vw,170px);height:min(46vw,170px);border-radius:50%;font:600 18px/1 system-ui,sans-serif;letter-spacing:.14em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  box-shadow:0 0 0 0 rgba(88,196,221,.5),0 0 40px rgba(88,196,221,.35) inset;animation:pulse 2.4s ease-out infinite}
#startBtn svg{width:34px;height:34px;fill:var(--accent)}
#startBtn:hover{background:rgba(88,196,221,.22)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,196,221,.45),0 0 40px rgba(88,196,221,.35) inset}100%{box-shadow:0 0 0 38px rgba(88,196,221,0),0 0 40px rgba(88,196,221,.35) inset}}
#startMute{margin-top:22px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:8px}
#overlay small{display:block;margin-top:14px;color:#7f8b9b;font-size:12px}

/* ---------- control panel ---------- */
#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,940px);z-index:20;
  background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:6px max(10px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left));
  transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#panel.ui-hidden{transform:translate(-50%,calc(100% + 4px))}
#bar{display:flex;align-items:center;justify-content:center;gap:4px;min-height:48px}
#bar .sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);height:44px;min-width:44px;
  padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font:500 13px system-ui,sans-serif;
  touch-action:manipulation;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{background:rgba(255,255,255,.18)}
.btn svg{width:22px;height:22px;flex:none;fill:currentColor}
.btn svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.on{border-color:var(--accent);color:var(--accent);background:rgba(88,196,221,.14)}
.btn.rec{color:#ff7a70}
.btn.rec.on{border-color:var(--red);background:rgba(252,98,85,.2);color:#fff;animation:blink 1.1s infinite}
@keyframes blink{50%{background:rgba(252,98,85,.06)}}
.btn.main{background:rgba(88,196,221,.16);border-color:rgba(88,196,221,.5);color:#fff}
#chev svg{transition:transform .3s}
#panel.collapsed #chev svg{transform:rotate(180deg)}
#body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
#panel.collapsed #body{grid-template-rows:0fr}
#bodyIn{overflow:hidden;min-height:0}
#scroll{max-height:min(48vh,430px);overflow-y:auto;overflow-x:hidden;padding:4px 2px 4px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#panel.collapsed #scroll{overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;padding:6px 2px 4px}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp h4{margin:2px 0 0;font:600 11px system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#cdd6e2}
.row .l{display:flex;justify-content:space-between;gap:8px}
.row .l b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.row.dis{opacity:.4}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--teal))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--teal))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--accent);margin-top:-9px;box-shadow:0 0 10px rgba(88,196,221,.6)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
select{width:100%;height:40px;background:rgba(255,255,255,.07);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:13px system-ui,sans-serif}
select option{background:#1a1e27;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:18px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);z-index:40;background:rgba(20,24,32,.92);
  border:1px solid var(--line);padding:9px 16px;border-radius:20px;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:all .35s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#showUI{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:19;width:46px;height:46px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer}
#showUI.show{display:flex}
#showUI svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){ .btn{min-width:40px;padding:0 7px} #bar{gap:3px} .grid{grid-template-columns:1fr 1fr;gap:8px 12px} .grp.wide{grid-column:1/-1} }
@media (max-width:380px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){#startBtn{animation:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="toast"></div>

<div id="overlay">
  <h1>Girih <em>&mdash;</em> Geometry in Motion</h1>
  <p>Turkish &amp; Seljuk star patterns, drawn line by line in the style of Manim, scored by a quiet deep-house groove and singing bowls. Every line you see rings a note.</p>
  <button id="startBtn" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>START</button>
  <button id="startMute">start without sound</button>
  <small>Headphones recommended &middot; drag to pan &middot; pinch / scroll to zoom</small>
</div>

<button id="showUI" aria-label="Show controls"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>

<div id="panel" class="collapsed">
  <div id="bar">
    <button class="btn" id="bPrev" aria-label="Previous pattern" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="btn main" id="bPlay" aria-label="Play / pause tour" title="Play / pause tour (space)"><svg viewBox="0 0 24 24" id="icoPause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><svg viewBox="0 0 24 24" id="icoPlay" style="display:none"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn" id="bNext" aria-label="Next pattern" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
    <button class="btn" id="bRand" aria-label="Randomize" title="Randomize (R)"><svg class="st" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="btn" id="bCons" aria-label="Construction mode" title="Construction mode (C)"><svg class="st" viewBox="0 0 24 24"><path d="M12 3v2M12 5L6 20M12 5l6 15M8.6 14.5h6.8"/></svg></button>
    <span class="sp"></span>
    <button class="btn" id="chev" aria-label="Collapse or expand controls" title="Controls"><svg class="st" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
  <div id="body"><div id="bodyIn"><div id="scroll">
    <div class="grid">
      <div class="grp">
        <h4>Pattern</h4>
        <label class="row"><span class="l"><span>Tiling</span></span><select id="selTil"></select></label>
        <label class="row"><span class="l"><span>Contact angle &theta;</span><b id="vTheta"></b></span><input type="range" id="rTheta" min="5" max="85" step="0.1"></label>
        <label class="row" id="rowN"><span class="l"><span>Symmetry n <i style="opacity:.6;font-style:normal">(rosette)</i></span><b id="vN"></b></span><input type="range" id="rN" min="5" max="24" step="1"></label>
        <label class="row"><span class="l"><span>Line width</span><b id="vLW"></b></span><input type="range" id="rLW" min="0.6" max="6" step="0.1"></label>
      </div>
      <div class="grp">
        <h4>Look</h4>
        <label class="row"><span class="l"><span>Colour theme</span></span><select id="selTheme"><option value="manim">Manim &mdash; blue / teal / gold</option><option value="iznik">&#304;znik tile &mdash; cobalt / turquoise / coral</option><option value="gold">Gold on black</option></select></label>
        <label class="row"><span class="l"><span>Style</span></span><select id="selStyle"><option value="lines">Lines</option><option value="fill">Filled cells</option><option value="weave">Interlaced weave</option></select></label>
        <div class="chips">
          <button class="btn chip on" id="tBreath">&theta; breathing</button>
          <button class="btn chip on" id="tCine">Cinematic camera</button>
        </div>
        <div class="chips" id="consBtns" style="display:none">
          <button class="btn chip" id="bStepPrev">&#9664; Step</button>
          <button class="btn chip" id="bStepNext">Step &#9654;</button>
          <button class="btn chip" id="bStepPause">Pause steps</button>
        </div>
      </div>
      <div class="grp">
        <h4>Sound</h4>
        <label class="row"><span class="l"><span>Master volume</span><b id="vVol"></b></span><input type="range" id="rVol" min="0" max="100" step="1"></label>
        <label class="row"><span class="l"><span>Tempo</span><b id="vBpm"></b></span><input type="range" id="rBpm" min="84" max="132" step="1"></label>
        <div class="chips">
          <button class="btn chip on" id="tMusic">Music</button>
          <button class="btn chip on" data-layer="beat">Beat</button>
          <button class="btn chip on" data-layer="bass">Bass</button>
          <button class="btn chip on" data-layer="chords">Chords</button>
          <button class="btn chip on" data-layer="zen">Zen bells</button>
        </div>
        <label class="row"><span class="l"><span>Bell scale</span></span><select id="selScale"><option value="pent">Minor pentatonic</option><option value="dorian">A Dorian</option><option value="hicaz">Hicaz (Turkish)</option></select></label>
      </div>
      <div class="grp wide">
        <h4>Export</h4>
        <div class="actions">
          <button class="btn" id="bPng"><svg class="st" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>PNG</button>
          <button class="btn rec" id="bRec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg><span id="recLbl">Record video</span></button>
          <button class="btn" id="bHide"><svg class="st" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0112 6c5 0 8.5 4 9.5 6a14 14 0 01-2.7 3.4M6.5 7.6A14 14 0 002.5 12c1 2 4.5 6 9.5 6a9.5 9.5 0 003.5-.7"/></svg>Hide UI</button>
        </div>
      </div>
    </div>
  </div></div></div>
</div>
<script>
'use strict';
// ======================================================================
//  GEOMETRY : tilings + Hankin "polygons in contact"
// ======================================================================
const TAU = Math.PI * 2;
const PHI = (1 + Math.sqrt(5)) / 2;
const rep = (arr, k) => { let o = []; for (let i = 0; i < k; i++) o = o.concat(arr); return o; };

class Hash2 {
  constructor(cell) { this.c = cell; this.m = new Map(); }
  add(x, y, v) {
    const k = Math.floor(x / this.c) + ',' + Math.floor(y / this.c);
    let a = this.m.get(k); if (!a) this.m.set(k, a = []);
    a.push([x, y, v]);
  }
  find(x, y, tol) {
    const ix = Math.floor(x / this.c), iy = Math.floor(y / this.c);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const a = this.m.get((ix + dx) + ',' + (iy + dy));
      if (a) for (let i = 0; i < a.length; i++) {
        const e = a[i];
        if (Math.abs(e[0] - x) < tol && Math.abs(e[1] - y) < tol) return e[2];
      }
    }
    return undefined;
  }
}

function mkPoly(vx, vy, cls) {
  const n = vx.length;
  const p = { n, vx, vy, cls, id: 0 };
  p.mx = new Float64Array(n); p.my = new Float64Array(n);
  p.ex = new Float64Array(n); p.ey = new Float64Array(n);
  p.nx = new Float64Array(n); p.ny = new Float64Array(n);
  p.dRx = new Float64Array(n); p.dRy = new Float64Array(n);
  p.dLx = new Float64Array(n); p.dLy = new Float64Array(n);
  p.Px = new Float64Array(n); p.Py = new Float64Array(n); p.ok = new Uint8Array(n);
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = vx[j] - vx[i], dy = vy[j] - vy[i], L = Math.hypot(dx, dy);
    p.ex[i] = dx / L; p.ey[i] = dy / L;
    p.nx[i] = -dy / L; p.ny[i] = dx / L;          // left normal = interior for CCW
    p.mx[i] = (vx[i] + vx[j]) / 2; p.my[i] = (vy[i] + vy[j]) / 2;
    cx += vx[i]; cy += vy[i];
  }
  p.cx = cx / n; p.cy = cy / n;
  let rm = 0; for (let i = 0; i < n; i++) rm = Math.max(rm, Math.hypot(vx[i] - p.cx, vy[i] - p.cy));
  p.rmax = rm;
  return p;
}
function fixCCW(vx, vy) {
  let a = 0; const n = vx.length;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; a += vx[i] * vy[j] - vx[j] * vy[i]; }
  if (a < 0) { vx.reverse(); vy.reverse(); }
}
function regPoly(n, cx, cy, phi, cls) {
  const R = 1 / (2 * Math.sin(Math.PI / n)), vx = [], vy = [];
  for (let i = 0; i < n; i++) { vx.push(cx + R * Math.cos(phi + TAU * i / n)); vy.push(cy + R * Math.sin(phi + TAU * i / n)); }
  return mkPoly(vx, vy, cls);
}
const apo = k => 1 / (2 * Math.tan(Math.PI / k));
const circR = k => 1 / (2 * Math.sin(Math.PI / k));

const TIL = {
  sq:    { name: 'Square 4.4.4.4', seed: 4, rules: { 4: [4, 4, 4, 4] }, span: 8, th: 45, foc: 4 },
  hex:   { name: 'Hexagonal 6.6.6', seed: 6, rules: { 6: rep([6], 6) }, span: 8, th: 60, foc: 6 },
  tri:   { name: 'Triangular 3.3.3.3.3.3', seed: 3, rules: { 3: [3, 3, 3] }, span: 6.5, th: 60, foc: 6 },
  kag:   { name: 'Trihexagonal 3.6.3.6', seed: 6, rules: { 6: rep([3], 6), 3: [6, 6, 6] }, span: 8, th: 45, foc: 6 },
  t488:  { name: 'Truncated square 4.8.8', seed: 8, rules: { 8: rep([4, 8], 4), 4: [8, 8, 8, 8] }, span: 8, th: 45, foc: 8 },
  t31212:{ name: 'Truncated hexagonal 3.12.12', seed: 12, rules: { 12: rep([3, 12], 6), 3: [12, 12, 12] }, span: 11, th: 60, foc: 12 },
  t4612: { name: 'Great rhombitrihexagonal 4.6.12', seed: 12, rules: { 12: rep([4, 6], 6), 6: rep([4, 12], 3), 4: [6, 12, 6, 12] }, span: 12, th: 60, foc: 12 },
  t3464: { name: 'Rhombitrihexagonal 3.4.6.4', seed: 6, rules: { 6: rep([4], 6), 4: [6, 3, 6, 3], 3: [4, 4, 4] }, span: 8, th: 60, foc: 6 },
  pen:   { name: 'Penrose rhombs (decagonal girih)', special: 'pen', span: 9, th: 54, foc: 10, kFix: 0, sMap: [2, 1, 2, 3] },
  ros:   { name: 'Radial rosette (n-fold medallion)', special: 'ros', span: 14, th: 55, foc: 12 },
};
const TIL_ORDER = ['hex', 'sq', 'tri', 'kag', 't488', 't31212', 't4612', 't3464', 'pen', 'ros'];

function rosetteDims(n) {
  const g = 1 + 1.9 * Math.sin(Math.PI / n);
  const rings = 3, r0 = circR(n), r = [r0];
  for (let j = 0; j < rings; j++) r.push(r[j] * g);
  return r;
}
function spanFor(key, n) {
  if (key === 'ros') { const r = rosetteDims(n); return r[r.length - 1] * 2.6; }
  return TIL[key].span;
}

function buildArchimedean(key, genR) {
  const T = TIL[key], polys = [], queue = [];
  const H = new Hash2(0.5);
  const types = Object.keys(T.rules).map(Number).sort((a, b) => b - a);
  const add = (n, cx, cy, phi, o) => {
    if (H.find(cx, cy, 0.05) !== undefined) return;
    const p = regPoly(n, cx, cy, phi, types.indexOf(n));
    p.phi = phi; p.o = o;
    H.add(cx, cy, 1); polys.push(p); queue.push(p);
  };
  add(T.seed, 0, 0, Math.PI / 2 + Math.PI / T.seed, 0);
  for (let qi = 0; qi < queue.length && polys.length < 6000; qi++) {
    const p = queue[qi];
    if (Math.hypot(p.cx, p.cy) > genR) continue;
    const S = T.rules[p.n];
    for (let i = 0; i < p.n; i++) {
      const m = S[(p.o + i) % p.n];
      const thu = p.phi + (i + 0.5) * TAU / p.n;
      const d = apo(p.n) + apo(m);
      const cx = p.cx + Math.cos(thu) * d, cy = p.cy + Math.sin(thu) * d;
      const o2 = T.rules[m].indexOf(p.n);
      add(m, cx, cy, thu + Math.PI - Math.PI / m, o2);
    }
  }
  return finishTiling(polys, { n: T.seed, R: circR(T.seed), phi: Math.PI / 2 + Math.PI / T.seed }, T.span);
}

function buildPenrose(genR) {
  const k = Math.max(3, Math.min(8, Math.ceil(Math.log(genR * 1.08) / Math.log(PHI))));
  let tri = [];
  for (let i = 0; i < 10; i++) {
    let B = [Math.cos((2 * i - 1) * Math.PI / 10), Math.sin((2 * i - 1) * Math.PI / 10)];
    let C = [Math.cos((2 * i + 1) * Math.PI / 10), Math.sin((2 * i + 1) * Math.PI / 10)];
    if (i % 2 === 0) { const t = B; B = C; C = t; }
    tri.push([0, [0, 0], B, C]);
  }
  const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  for (let it = 0; it < k; it++) {
    const out = [];
    for (const [c, A, B, C] of tri) {
      if (c === 0) {
        const P = lerp2(A, B, 1 / PHI);
        out.push([0, C, P, B], [1, P, C, A]);
      } else {
        const Q = lerp2(B, A, 1 / PHI), R = lerp2(B, C, 1 / PHI);
        out.push([1, R, C, A], [1, Q, R, B], [0, R, Q, A]);
      }
    }
    tri = out;
  }

}
function render() {

}

// ======================================================================
//  UI wiring
// ======================================================================
let toastT = 0;
function toast(msg, ms) {

}
function setTour(on) {
  S.tour = on; $('icoPause').style.display = on ? '' : 'none'; $('icoPlay').style.display = on ? 'none' : '';
  $('bPlay').setAttribute('aria-label', on ? 'Pause tour' : 'Play tour'); AE.barsSince = 0;
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
const stamp = () => new Date().toISOString().replace(/[-:]/g, '').slice(0, 13);
function exportPNG() {
  render();
  cv.toBlob(b => { if (b) { download(b, `turkish-geometry-${stamp()}.png`); toast('PNG saved'); } }, 'image/png');
}
function toggleRec() {
  if (recording) { try { recording.mr.stop(); } catch (e) { } return; }
  if (!window.MediaRecorder || !cv.captureStream) { toast('Video recording is not supported in this browser (try Chrome, Edge or Firefox).', 4200); return; }
  const stream = cv.captureStream(60);
  if (AE.ok && AE.recDest) AE.recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  const mime = mimes.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';

  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6, audioBitsPerSecond: 160000 } : undefined); }
  catch (e) { toast('Could not start recording: ' + e.message, 4000); return; }

  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const type = mr.mimeType || mime || 'video/webm', ext = /mp4/.test(type) ? 'mp4' : 'webm';
    download(new Blob(chunks, { type }), `turkish-geometry-${stamp()}.${ext}`);
    toast('Video saved (.' + ext + ')'); recording = null; $('bRec').classList.remove('on'); $('recLbl').textContent = 'Record video';
  };
  mr.start(500); recording = { mr, t0: performance.now() };
  $('bRec').classList.add('on'); $('recLbl').textContent = 'Stop & save';
  toast('Recording\u2026 tap again to stop and download', 2800);
  setTimeout(() => { if (recording && recording.mr === mr) { try { mr.stop(); } catch (e) { } } }, 180000);
}

function wireUI() {
  TIL_ORDER.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = TIL[k].name; $('selTil').appendChild(o); });
  $('rVol').value = Math.round(AE.vol * 100); $('vVol').textContent = Math.round(AE.vol * 100) + '%';
  $('rBpm').value = AE.bpm; $('vBpm').textContent = AE.bpm;
  $('bPrev').onclick = () => goPreset(-1, {});
  $('bNext').onclick = () => goPreset(1, {});
  $('bPlay').onclick = () => setTour(!S.tour);
  $('bRand').onclick = randomize;
  $('bCons').onclick = () => setCons(!cons.active);
  $('chev').onclick = () => $('panel').classList.toggle('collapsed');
  $('bPng').onclick = exportPNG; $('bRec').onclick = toggleRec;
  $('bHide').onclick = () => setUIHidden(true); $('showUI').onclick = () => setUIHidden(false);
  $('bStepNext').onclick = () => { const i = Math.min(5, consStepIndex() + 1); cons.t = consStart(i) + 0.01; };
  $('bStepPrev').onclick = () => { const i = Math.max(0, consStepIndex() - (cons.t - consStart(consStepIndex()) > 1 ? 0 : 1)); cons.t = consStart(i) + 0.01; };
  $('bStepPause').onclick = e => { cons.paused = !cons.paused; e.currentTarget.classList.toggle('on', cons.paused); e.currentTarget.textContent = cons.paused ? 'Resume steps' : 'Pause steps'; };
  $('selTil').onchange = e => { S.til = e.target.value; const T0 = TIL[S.til]; S.th = T0.th; S.n = T0.special === 'ros' ? S.n : T0.foc; S.preset = -1; customTitle(); showPattern({}); };
  $('rTheta').oninput = e => { S.th = +e.target.value; $('vTheta').textContent = S.th.toFixed(1) + '\u00b0'; A.dirty = true; };
  $('rN').oninput = e => {
    S.n = +e.target.value; $('vN').textContent = S.n;
    if (TIL[S.til].special === 'ros') { rebuild(null); customTitle('Rosette \u2014 ' + S.n + '-fold Medallion'); if (titles.length) { titles[titles.length - 1].spec = { frac: S.title.frac, text: S.title.text }; titles[titles.length - 1].t0 = T - 3; } }
  };
  $('rLW').oninput = e => { S.lineW = +e.target.value; $('vLW').textContent = S.lineW.toFixed(1); };
  $('selTheme').onchange = e => { S.theme = e.target.value; bgCache.key = ''; document.body.style.background = THEMES[S.theme].bg[1]; };
  $('selStyle').onchange = e => { S.style = e.target.value; if (A.mode === 'hold') { A.fillA = 0; } };
  $('tBreath').onclick = e => { S.breathe = !S.breathe; e.currentTarget.classList.toggle('on', S.breathe); A.dirty = true; };
  $('tCine').onclick = e => { S.cine = !S.cine; e.currentTarget.classList.toggle('on', S.cine); };
  $('rVol').oninput = e => { AE.setVol(+e.target.value / 100); $('vVol').textContent = e.target.value + '%'; };
  $('rBpm').oninput = e => { AE.setBpm(+e.target.value); $('vBpm').textContent = e.target.value; };
  $('tMusic').onclick = e => { AE.setMusic(!AE.musicOn); e.currentTarget.classList.toggle('on', AE.musicOn); };
  document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => { const k = b.dataset.layer; AE.setLayer(k, !AE.layers[k]); b.classList.toggle('on', AE.layers[k]); });
  $('selScale').onchange = e => { AE.scale = e.target.value; };

  window.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) return;
    if (e.code === 'Space') { e.preventDefault(); setTour(!S.tour); }
    else if (e.key === 'ArrowRight') goPreset(1, {});
    else if (e.key === 'ArrowLeft') goPreset(-1, {});
    else if (e.key === 'r' || e.key === 'R') randomize();
    else if (e.key === 'c' || e.key === 'C') setCons(!cons.active);
    else if (e.key === 'h' || e.key === 'H') setUIHidden(!uiHidden);
    else if (e.key === 'p' || e.key === 'P') exportPNG();
  });

  // pointer: drag to pan, pinch to zoom, wheel zoom, double-tap reset
  const ptrs = new Map(); let pinch0 = 0, uz0 = 1, lastTap = 0;
  const maxPan = () => 0.3 * Math.min(W, H);
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); uz0 = view.uzT; }
    const now = performance.now(); if (ptrs.size === 1) { if (now - lastTap < 320) { view.uzT = 1; view.panX = view.panY = 0; } lastTap = now; } });
  cv.addEventListener('pointermove', e => {

  });

  cv.addEventListener('wheel', e => { e.preventDefault(); view.uzT = clamp(view.uzT * Math.exp(-e.deltaY * 0.0015), view.uzMin || 0.8, 5); }, { passive: false });
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resize, 120); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
}
function setUIHidden(h) {
  uiHidden = h; $('panel').classList.toggle('ui-hidden', h); $('showUI').classList.toggle('show', h);
}

// ======================================================================
//  start / boot
// ======================================================================
async function startApp(sound) {

    } else toast('Web Audio is not available \u2014 running silent.');
  }

  AE.onKick = i => { pulse = 1; beatIdx = i & 3; };

  set: o => { Object.assign(S, o); if (o.theme) { bgCache.key = ''; document.body.style.background = THEMES[S.theme].bg[1]; } syncUI(); A.dirty = true; },
  til: (k, th, n) => { S.til = k; S.th = th != null ? th : TIL[k].th; if (n) S.n = n; syncUI(); rebuild(null); customTitle(); newTitle(); beginCreate(); },

boot();
