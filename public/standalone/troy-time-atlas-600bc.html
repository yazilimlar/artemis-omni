<script type="module">
import * as THREE from "three";

/* ================= Geo projection (KML → scene) =================
   Scene axes: x east-ish, z south-ish AFTER a -45° rotation so that true
   north points into the upper (far) frame diagonal of the isometric camera.
   1 unit = 100 m at the citadel; beyond R0 the radius is compressed
   (r' = R0 + (r-R0)^COMP · K) so the 8 km Troad reads as one diorama.
   Heights use a ×5 vertical exaggeration. */
const ORIGIN = { lon: 26.238889, lat: 39.9575 };           // Hisarlık summit
const M_LON = 85345, M_LAT = 111132, M_PER_UNIT = 100;
const R0 = 3, COMP = 0.55, K = 1.2;
function geo(lon, lat) {
  const x0 = (lon - ORIGIN.lon) * M_LON / M_PER_UNIT;
  const z0 = -((lat - ORIGIN.lat) * M_LAT / M_PER_UNIT);
  let x = (x0 + z0) * Math.SQRT1_2;                        // rotate -45°
  let z = (z0 - x0) * Math.SQRT1_2;
  const r = Math.hypot(x, z);
  if (r > R0) { const s = (R0 + Math.pow(r - R0, COMP) * K) / r; x *= s; z *= s; }
  return [x, z];
}

const RIVER_LL  = [[26.1780,40.0080],[26.1900,39.9850],[26.1950,39.9770],[26.2000,39.9700],[26.2050,39.9650],[26.2100,39.9600],[26.2150,39.9550],[26.2200,39.9500],[26.2250,39.9450]];

const ERAS = [

/* ================= Terrain ================= */
const BOUNDS = { minX:-28, maxX:32, minZ:-26, maxZ:16 };
/* Shoreline: water begins beyond a bearing-dependent radius (scene polar angle, degrees). */
const COAST = [[150,17],[165,15.8],[174,14.6],[185,13.6],[200,13.2],[225,13.8],[245,14.4],[258,15.9],[275,16.6],[295,18],[310,21]];
function coastDist(aDeg) {
  if (aDeg < COAST[0][0] || aDeg > COAST[COAST.length-1][0]) return Infinity;
  for (let i = 0; i < COAST.length - 1; i++) {
    const [a0,d0] = COAST[i], [a1,d1] = COAST[i+1];
    if (aDeg >= a0 && aDeg <= a1) { const t = (aDeg-a0)/(a1-a0); return d0 + (d1-d0)*t; }
  }
  return Infinity;
}
const RIVER = RIVER_LL.map(([lo,la]) => geo(lo,la));
function distToRiver(x, z) {
  let min = Infinity, minT = 0;
  for (let i = 0; i < RIVER.length-1; i++) {
    const [ax,az] = RIVER[i], [bx,bz] = RIVER[i+1];
    const abx = bx-ax, abz = bz-az;
    const t = Math.max(0, Math.min(1, ((x-ax)*abx + (z-az)*abz) / (abx*abx + abz*abz)));
    const d = Math.hypot(x-(ax+abx*t), z-(az+abz*t));
    if (d < min) { min = d; minT = (i+t)/(RIVER.length-1); }
  }
  return [min, minT];
}
function smoothstep(e0, e1, x) { const t = Math.min(1, Math.max(0, (x-e0)/(e1-e0))); return t*t*(3-2*t); }
function gauss(x, z, cx, cz, r) { const dx=x-cx, dz=z-cz; return Math.exp(-(dx*dx+dz*dz)/(r*r)); }
const SIG = geo(26.1800,39.9936), HANAY = geo(26.2530,39.9300), KUM = geo(26.2011,39.9860), RHOET = geo(26.2850,40.0150);
function heightAt(x, z) {
  let h = 0.34 + 0.15*Math.sin(x*0.35)*Math.cos(z*0.3) + 0.09*Math.sin(x*0.8+1.7)*Math.sin(z*0.7+0.4);
  const r = Math.hypot(x, z);
  let a = Math.atan2(z, x) * 180/Math.PI; if (a < 0) a += 360;
  const cd = coastDist(a);
  if (isFinite(cd)) { const land = 1 - smoothstep(cd-1.3, cd+1.1, r); h = h*land + (-1.7)*(1-land); }
  h += 1.55 * (1 - smoothstep(1.05, 2.05, r));                    // Hisarlık plateau (~30 m ×5)
  h += 0.28 * gauss(x, z, 1.9, 0.4, 2.6);                         // lower-town shelf
  h += 1.15 * gauss(x, z, SIG[0]+0.6, SIG[1]+0.4, 2.3);           // Sigeion / Yenişehir ridge
  h += 0.85 * gauss(x, z, HANAY[0], HANAY[1], 0.75);              // Hanay Tepe tumulus
  h += 0.55 * gauss(x, z, KUM[0], KUM[1], 0.55);                  // Kumtepe tell
  h += 0.38 * gauss(x, z, RHOET[0]-0.8, RHOET[1]+1.0, 0.8);       // In Tepe headland

    trees.push([x, h, z, 0.8+rnd()*0.7, 1]); pines++;
  }
  const trunkI = new THREE.InstancedMesh(trunkG, new THREE.MeshStandardMaterial({ color:"#6b5138", roughness:.95 }), trees.length);
  const oliveI = new THREE.InstancedMesh(oliveG, new THREE.MeshStandardMaterial({ roughness:.95, flatShading:true }), trees.length);
  const pineI  = new THREE.InstancedMesh(pineG,  new THREE.MeshStandardMaterial({ roughness:.95, flatShading:true }), trees.length);
  const greens = ["#7d8f57","#6e874d","#8a9a62","#5f7a44"], pgreens = ["#3d5a3a","#466345","#35503a"];
  let oi = 0, pi = 0;
  trees.forEach(([x, h, z, s, kind], i) => {
    d.rotation.set(0,0,0);
    d.position.set(x, h+0.12*s, z); d.scale.setScalar(s); d.updateMatrix();
    trunkI.setMatrixAt(i, d.matrix);
    if (kind === 0) {
      d.position.y = h + 0.36*s; d.rotation.y = i*1.7; d.scale.set(s, s*0.8, s); d.updateMatrix();
      oliveI.setMatrixAt(oi, d.matrix); oliveI.setColorAt(oi, c.set(greens[i % 4])); oi++;
    } else {
      d.position.y = h + 0.48*s; d.updateMatrix();
      pineI.setMatrixAt(pi, d.matrix); pineI.setColorAt(pi, c.set(pgreens[i % 3])); pi++;
    }
  });
  oliveI.count = oi; pineI.count = pi;
  scene.add(trunkI, oliveI, pineI);
}

/* ---- ghost eras (wireframe teasers, opacity by scroll proximity) ---- */
const ghosts = [];
function ghostGroup(order, color, build) {
  const m = new THREE.MeshBasicMaterial({ color, wireframe:true, transparent:true, opacity:0, depthWrite:false });
  const g = new THREE.Group(); g.visible = false;
  build((geoArgs, x, y, z, ry = 0, sx = 1, sz = 1) => {
    const mesh = new THREE.Mesh(geoArgs, m);
    mesh.position.set(x, y, z); mesh.rotation.y = ry; mesh.scale.set(sx, 1, sz);
    g.add(mesh);
  });
  scene.add(g); ghosts.push({ g, m, order });
}
const plateauY = heightAt(0, 0);
ghostGroup(0, "#e09a68", (add) => {                                // 1200 BC — Troy VI
  add(new THREE.CylinderGeometry(1.7, 1.9, 0.85, 18, 1, true), 0, plateauY-0.35, 0);
  for (const a of [0.35, 1.7, 3.7, 5.1]) add(new THREE.BoxGeometry(.5,.95,.5), Math.cos(a)*1.75, plateauY-0.1, Math.sin(a)*1.75, -a);
  add(new THREE.BoxGeometry(.9,.5,.55), -0.15, plateauY+0.3, 0.15);
  add(new THREE.CylinderGeometry(3.4, 3.6, 0.45, 22, 1, true), 1.6, 0.4, 0.3, 0, 1, 0.8);
});
ghostGroup(2, "#ccd3e4", (add) => {                                // 150 AD — Roman Ilium
  const [tx,tz] = geo(26.2386, 39.9578);
  add(new THREE.BoxGeometry(1.6,.6,.95), tx, plateauY+0.3, tz, -0.35);
  add(new THREE.CylinderGeometry(.6,.6,.4,14,1,false,0,Math.PI), 1.9, heightAt(1.9,0.9)+0.2, 0.9, 2.4);
  add(new THREE.BoxGeometry(.55,.35,.55), 1.4, heightAt(1.4,-1)+0.2, -1);
  for (const o of [-0.6, 0.6]) {
    add(new THREE.BoxGeometry(3,.03,.16), 1.9+o, heightAt(1.9,0.4)+0.1, 0.4-o, 0.8);
    add(new THREE.BoxGeometry(3,.03,.16), 1.9+o, heightAt(1.9,0.4)+0.1, 0.4+o, -0.75);
  }
});
ghostGroup(3, "#7fd4b8", (add) => {                                // 2026 AD — the dig
  add(new THREE.BoxGeometry(.7,.8,2.1), -0.3, plateauY-0.3, 0.15, 0.3);
  add(new THREE.BoxGeometry(1.7,.05,1.35), 0.4, plateauY+0.55, -0.25, 0, 1, 1);
  const ramp = new THREE.TorusGeometry(2.1, 0.09, 4, 26, Math.PI*1.35);
  ramp.rotateX(-Math.PI/2);
  add(ramp, 0, plateauY-0.5, 0);
  add(new THREE.BoxGeometry(.7,.3,.45), 2.9, heightAt(2.9,-1.3)+0.18, -1.3);
});

/* ---- POI markers ---- */
const markers = [], markerRoot = new THREE.Group();
scene.add(markerRoot);
for (const poi of POIS) {
  const [x, z] = geo(poi.lon, poi.lat);
  const baseY = groundY(x, z) + poi.yOff * 0.6 + 0.35;
  const color = new THREE.Color(LAYERS[poi.layer].color);
  const g = new THREE.Group(); g.position.set(x, baseY, z);
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9, transparent: true }));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.022, 6, 24),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75 }));
  ring.rotation.x = Math.PI/2;
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  g.add(core, ring, hit);
  g.userData = { poi, baseY, phase: markers.length * 1.31, core, ring };
  markerRoot.add(g); markers.push(g);
}

/* ================= UI ================= */
const $ = (s) => document.querySelector(s);
const state = { era: 1, eraF: 1, layers: new Set(), selected: null, parX: 0, parY: 0, reduced: matchMedia("(prefers-reduced-motion: reduce)").matches };

/* sections + rail + chips */
const secWrap = $("#sections");
secWrap.innerHTML = ERAS.map(e => `
  <section aria-label="${e.year} — ${e.title}"><div class="card">
    <div class="tags"><span class="pill" style="border-color:${e.accent}88;color:${e.accent};background:${e.accent}1a"><span class="d" style="background:${e.accent}"></span>${e.status === "active" ? "Active era" : "Ghost era"}</span>
    <span class="kick">${e.kicker}</span></div>
    <h2><span style="color:${e.accent}">${e.year}</span> — ${e.title}</h2>
    <p>${e.summary}</p><p class="note">${e.note}</p>
  </div></section>`).join("");
const rail = $("#rail");
rail.innerHTML = ERAS.map((e, i) => `<button data-i="${i}" aria-label="${e.year}"><span class="yr">${e.year}</span><span class="dot"></span></button>`).join("");
rail.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (b) scrollTo({ top: (+b.dataset.i) * innerHeight, behavior: "smooth" });
});
function syncRail() {
  rail.querySelectorAll("button").forEach((b, i) => {
    const active = i === state.era, a = ERAS[i].accent;
    b.classList.toggle("active", active);
    b.querySelector(".yr").style.color = active ? a : "#fff";
    const dot = b.querySelector(".dot");
    dot.style.borderColor = active ? a : "rgba(255,255,255,.4)";
    dot.style.background = active ? a : "transparent";
    dot.style.boxShadow = active ? `0 0 10px ${a}` : "none";
  });
}
const chips = $("#chips");
chips.innerHTML = Object.entries(LAYERS).map(([id, l]) =>
  `<button data-id="${id}" aria-pressed="false" title="${l.name}"><span class="d"></span>${l.name}</button>`).join("");
chips.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  const id = b.dataset.id;
  state.layers.has(id) ? state.layers.delete(id) : state.layers.add(id);
  const on = state.layers.has(id), l = LAYERS[id];
  b.setAttribute("aria-pressed", on);
  b.style.borderColor = on ? l.color : "rgba(255,255,255,.18)";
  b.style.color = on ? l.color : "rgba(255,255,255,.72)";
  b.style.background = on ? l.color + "26" : "rgba(10,8,16,.45)";
  b.querySelector(".d").style.background = on ? l.color : "rgba(255,255,255,.35)";
  for (const k in layerGroups) for (const m of layerGroups[k]) m.emissiveIntensity = state.layers.has(k) ? 0.45 : 0;
});

/* sheet */
const sheet = $("#sheet");
function openSheet(poi) {
  state.selected = poi.id;
  $("#sh-name").textContent = poi.name;
  const l = LAYERS[poi.layer], cf = CONF[poi.conf];
  $("#sh-badges").innerHTML =
    `<span class="pill" style="border-color:${cf.color}66;color:${cf.color};background:${cf.color}14"><span class="d" style="background:${cf.color}"></span>${cf.label}</span>` +
    `<span class="pill" style="border-color:${l.color}66;color:${l.color};background:${l.color}14"><span class="d" style="background:${l.color}"></span>${l.name}</span>` +
    `<span class="pill" style="border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.5)">${poi.lon.toFixed(4)}°E ${poi.lat.toFixed(4)}°N</span>`;
  $("#sh-summary").textContent = poi.summary;
  $("#sh-evidence").textContent = poi.evidence;
  $("#sh-evidence").style.borderColor = l.color;
  $("#sh-src").textContent = "SOURCE — " + poi.src;
  sheet.classList.add("open");
}
function closeSheet() { state.selected = null; sheet.classList.remove("open"); }
$("#sh-close").addEventListener("click", closeSheet);
{ /* drag to dismiss */
  let y0 = null, dy = 0;
  sheet.addEventListener("touchstart", (e) => { y0 = e.touches[0].clientY; sheet.style.transition = "none"; }, { passive: true });
  sheet.addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener("touchend", () => {
    sheet.style.transition = ""; sheet.style.transform = "";
    if (dy > 80) closeSheet();
    y0 = null; dy = 0;
  });
}

/* scroll → era */
const tintEl = $("#tint");
function parseTint(t) { const m = t.match(/rgba\((\d+),(\d+),(\d+),([.\d]+)\)/); return m ? [+m[1],+m[2],+m[3],+m[4]] : [0,0,0,0]; }
const tints = ERAS.map(e => parseTint(e.tint.replace(/\s/g, "")));
function onScroll() {
  const p = Math.min(1, Math.max(0, scrollY / (innerHeight * (ERAS.length - 1))));
  state.eraF = p * (ERAS.length - 1);
  const era = Math.round(state.eraF);
  if (era !== state.era) { state.era = era; syncRail(); closeSheet(); }
  const i = Math.min(ERAS.length - 2, Math.floor(state.eraF)), t = state.eraF - i;
  const a = tints[i], b = tints[i + 1];
  tintEl.style.backgroundColor = `rgba(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)},${(a[3]+(b[3]-a[3])*t).toFixed(3)})`;
  chips.classList.toggle("hidden", era !== 1);
}
addEventListener("scroll", onScroll, { passive: true });

/* parallax: pointer + device tilt (no iOS permission prompt — falls back to pointer) */
addEventListener("pointermove", (e) => {
  state.parX = (e.clientX / innerWidth - 0.5) * 2;
  state.parY = (e.clientY / innerHeight - 0.5) * 2;
}, { passive: true });
addEventListener("deviceorientation", (e) => {
  if (e.gamma == null || e.beta == null) return;
  state.parX = Math.max(-1, Math.min(1, e.gamma / 28));
  state.parY = Math.max(-1, Math.min(1, (e.beta - 42) / 28));
}, true);

/* tap → raycast markers */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; }, { passive: true });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 9) { downAt = null; return; }
  downAt = null;
  if (state.era !== 1) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(markerRoot.children, true);
  if (hits.length) {
    let g = hits[0].object; while (g.parent !== markerRoot) g = g.parent;
    openSheet(g.userData.poi);
  } else closeSheet();
});
renderer.domElement.addEventListener("pointermove", (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  document.body.style.cursor = (state.era === 1 && ray.intersectObjects(markerRoot.children, true).length) ? "pointer" : "auto";
}, { passive: true });

/* ================= camera + frame loop ================= */
const BASE_TARGET = new THREE.Vector3(-1.9, 0.7, -0.55), OFFSET = new THREE.Vector3(26, 24, 26);
const RIGHT = new THREE.Vector3(1, 0, -1).normalize();
const pan = new THREE.Vector3(), want = new THREE.Vector3(), tmp = new THREE.Vector3();
function resize() {
  const w = mount.clientWidth, h = mount.clientHeight;
  renderer.setSize(w, h);
  const zoom = Math.max(9, Math.min(w / 25, h / 37));
  camera.left = -w / 2 / zoom; camera.right = w / 2 / zoom;
  camera.top = h / 2 / zoom; camera.bottom = -h / 2 / zoom;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
function damp(cur, tgt, l, dt) { return THREE.MathUtils.damp(cur, tgt, l, dt); }
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (state.reduced) want.set(0, 0, 0);
  else want.copy(RIGHT).multiplyScalar(Math.sin(t * 0.07) * 1.2 + state.parX * 0.9)
           .add(tmp.set(0, Math.sin(t * 0.05) * 0.4 - state.parY * 0.6, 0));
  pan.set(damp(pan.x, want.x, 2.2, dt), damp(pan.y, want.y, 2.2, dt), damp(pan.z, want.z, 2.2, dt));
  camera.position.copy(BASE_TARGET).add(OFFSET).add(pan);
  camera.lookAt(tmp.copy(BASE_TARGET).add(pan));

  const eraW = Math.max(0, 1 - Math.abs(state.eraF - 1));         // marker presence at 600 BC
  markers.forEach((g) => {
    const { baseY, phase, poi } = g.userData;
    const dim = state.layers.size > 0 && !state.layers.has(poi.layer);
    const sel = state.selected === poi.id;
    const target = eraW * (sel ? 1.4 : dim ? 0.4 : 1);
    const s = damp(g.scale.x, target, 6, dt);
    g.scale.setScalar(Math.max(s, 0.0001));
    g.visible = s > 0.04;
    g.position.y = baseY + Math.sin(t * 1.7 + phase) * 0.09;
    g.rotation.y = t * 0.7 + phase;
  });
  for (const { g, m, order } of ghosts) {
    const prox = Math.max(0, 1 - Math.abs(state.eraF - order));
    m.opacity = Math.max(0, prox - 0.12) * 0.8;
    g.visible = m.opacity > 0.02;
    g.position.y = (1 - prox) * 1.0;
  }
  renderer.render(scene, camera);
});

/* land on 600 BC, then reveal */
syncRail(); onScroll();
requestAnimationFrame(() => {
  scrollTo(0, innerHeight);
  setTimeout(() => { const l = $("#loading"); l.style.opacity = "0"; setTimeout(() => l.remove(), 650); }, 250);
});
</script>
</body>
</html>
