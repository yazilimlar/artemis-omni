<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ARTEMIS · Intelligent Systems — 3D Brand Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#070d1c; --sapphire:#0f1d3a; --cobalt:#1b3a73;
    --ice:#bfe6ff; --gold:#d9b25e; --gold-dim:#9b7d3d; --line:rgba(217,178,94,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:
     radial-gradient(120% 90% at 50% 12%, #11203f 0%, #0a1226 45%, #04070f 100%);
     color:var(--ice);font-family:'Cormorant Garamond',Georgia,serif;}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  /* ---- top wordmark ---- */
  .topmark{position:fixed;top:22px;left:0;right:0;text-align:center;pointer-events:none;z-index:5;
    opacity:0;animation:fade 1.4s ease .5s forwards}
  .topmark .a{font-family:'Cinzel',serif;letter-spacing:.42em;font-weight:600;
    font-size:clamp(15px,2.4vw,26px);
    background:linear-gradient(180deg,#f4e2b0,#d9b25e 55%,#8a6a2f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 22px rgba(217,178,94,.18);padding-left:.42em}
  .topmark .s{font-family:'Cinzel',serif;letter-spacing:.62em;font-size:clamp(8px,1.1vw,11px);
    color:#7fa6cf;margin-top:6px;padding-left:.62em}
  .topmark .rule{width:min(46vw,420px);height:1px;margin:11px auto 0;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}

  /* ---- control dock ---- */
  .dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:9px;flex-wrap:wrap;justify-content:center;z-index:6;
    padding:9px 11px;border-radius:14px;max-width:94vw;
    background:linear-gradient(180deg,rgba(16,30,60,.62),rgba(8,15,32,.74));
    border:1px solid rgba(217,178,94,.22);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(191,230,255,.05);
    opacity:0;animation:rise 1s ease .8s forwards}
  .btn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:#cfe4ff;
    background:rgba(27,58,115,.28);border:1px solid rgba(127,166,207,.28);
    padding:8px 13px;border-radius:9px;cursor:pointer;transition:.22s ease;
    text-transform:uppercase;white-space:nowrap;user-select:none}
  .btn:hover{background:rgba(217,178,94,.16);border-color:rgba(217,178,94,.55);color:#f4e2b0;
    box-shadow:0 0 18px rgba(217,178,94,.18)}
  .btn.on{background:linear-gradient(180deg,rgba(217,178,94,.28),rgba(217,178,94,.12));
    border-color:rgba(217,178,94,.7);color:#fbeec2;text-shadow:0 0 10px rgba(217,178,94,.4)}

  .hint{position:fixed;bottom:74px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;
    font-family:'Cinzel',serif;letter-spacing:.34em;font-size:10px;color:#5d7ba3;
    text-transform:uppercase;opacity:0;animation:fade 1.4s ease 1.4s forwards}

  /* ---- loader ---- */
  #loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(circle at 50% 45%,#0c1733,#04070f);transition:opacity .9s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .ring{width:74px;height:74px;border-radius:50%;
    border:1.5px solid rgba(217,178,94,.18);border-top-color:var(--gold);
    animation:spin 1.1s linear infinite;box-shadow:0 0 30px rgba(217,178,94,.12)}
  .ldtxt{font-family:'Cinzel',serif;letter-spacing:.5em;font-size:12px;color:#caa24a;padding-left:.5em}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(14px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @media (max-width:520px){ .btn{padding:7px 10px;font-size:10px;letter-spacing:.1em} .hint{display:none} }
</style>
</head>
<body>
<div id="app"></div>

<div class="topmark">
  <div class="a">ARTEMIS</div>
  <div class="s">INTELLIGENT&nbsp;SYSTEMS</div>
  <div class="rule"></div>
</div>

<div class="hint">drag&nbsp;to&nbsp;orbit&nbsp;·&nbsp;scroll&nbsp;to&nbsp;zoom</div>

<div class="dock">
  <div class="btn on" id="b-rotate">Orbit</div>
  <div class="btn on" id="b-beam">Arrow</div>
  <div class="btn on" id="b-marble">Marble</div>
  <div class="btn on" id="b-stars">Cosmos</div>
  <div class="btn" id="b-front">Front</div>
  <div class="btn" id="b-reset">Reset</div>
</div>

<div id="loader"><div class="ring"></div><div class="ldtxt">CALIBRATING&nbsp;THE&nbsp;INSTRUMENT</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const T = THREE;

/* ============================== palette ============================== */
const COL = {
  navy:0x070d1c, sapphire:0x0f1d3a, cobalt:0x1b3a73, deep:0x0a1530,
  ice:0xbfe6ff, iceDim:0x6fb6e6, cyan:0x35e0ff, teal:0x49f2d6,
  gold:0xd9b25e, goldHi:0xf4e2b0, goldDim:0x8a6a2f, moon:0xe8cf86,
  marble:0x18324f, marbleEm:0x0c2138
};

/* ============================== renderer ============================= */
const app = document.getElementById('app');
const renderer = new T.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
app.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.FogExp2(0x05080f, 0.018);

const camera = new T.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);

/* ============================== lights ============================== */
scene.add(new T.AmbientLight(0x2a3f63, 0.7));
const key = new T.DirectionalLight(0x9fc6ff, 0.85); key.position.set(-4,7,9); scene.add(key);
const rim = new T.DirectionalLight(0x6fa0ff, 0.45); rim.position.set(6,2,-8); scene.add(rim);
const moonLight = new T.PointLight(0xf0d79a, 0.8, 26); moonLight.position.set(-2.2,3.6,1.5); scene.add(moonLight);
const bowLight  = new T.PointLight(0x49f2d6, 0.9, 16); bowLight.position.set(2.4,1.6,1.2); scene.add(bowLight);

/* ============================== helpers ============================= */
function glowTexture(inner='rgba(255,255,255,1)', outer='rgba(255,255,255,0)'){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,inner); grd.addColorStop(0.4,inner); grd.addColorStop(1,outer);
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const t=new T.CanvasTexture(c); t.needsUpdate=true; return t;
}
const TX_WHITE = glowTexture('rgba(190,230,255,.95)','rgba(190,230,255,0)');
const TX_CYAN  = glowTexture('rgba(73,242,214,.95)','rgba(53,224,255,0)');
const TX_GOLD  = glowTexture('rgba(244,226,176,.95)','rgba(217,178,94,0)');

function glowSprite(tex, size, color){
  const m=new T.SpriteMaterial({map:tex,color:color,transparent:true,
    blending:T.AdditiveBlending,depthWrite:false,opacity:.9});
  const s=new T.Sprite(m); s.scale.set(size,size,1); return s;
}
const V = (x,y,z)=>new T.Vector3(x,y,z);

/* ====================== shared figure materials ===================== */
const FIG_WIRE = new T.MeshBasicMaterial({color:0x9fe4ff, wireframe:true,
  transparent:true, opacity:0.5, blending:T.AdditiveBlending, depthWrite:false});
const FIG_SKIN = new T.MeshStandardMaterial({color:COL.marble, emissive:COL.marbleEm,
  emissiveIntensity:.6, roughness:.55, metalness:.15, transparent:true, opacity:.34,
  side:T.FrontSide});
const skinMeshes=[];

/* metal/edge materials for architecture */
const matStone = new T.MeshStandardMaterial({color:0x16273f, roughness:.6, metalness:.5,
  emissive:0x0a1426, emissiveIntensity:.4});
const matStoneDk = new T.MeshStandardMaterial({color:0x0e1b30, roughness:.7, metalness:.4});
const matGold = new T.MeshStandardMaterial({color:COL.gold, roughness:.32, metalness:.95,
  emissive:0x4a3613, emissiveIntensity:.45});
const matGoldGlow = new T.MeshBasicMaterial({color:0xe7c878, transparent:true, opacity:.9,
  blending:T.AdditiveBlending, depthWrite:false});
const matCyan = new T.MeshStandardMaterial({color:0x2aa9bf, roughness:.3, metalness:.7,
  emissive:0x18c6c6, emissiveIntensity:.9});
const lineGold = new T.LineBasicMaterial({color:0xcaa24a, transparent:true, opacity:.55});
const lineCyan = new T.LineBasicMaterial({color:0x49f2d6, transparent:true, opacity:.85,
  blending:T.AdditiveBlending, depthWrite:false});

/* ============================== STAGE root ========================== */
const stage = new T.Group(); scene.add(stage);

/* ============================== COSMOS ============================== */
const cosmos = new T.Group(); stage.add(cosmos);

// starfield
function buildStars(count, rMin, rMax, size, hueShift){
  const pos=new Float32Array(count*3); const col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=rMin+Math.random()*(rMax-rMin);
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*0.7;
    pos[i*3+2]=r*Math.cos(ph)-6;
    const t=Math.random();
    col[i*3]=0.6+0.4*t; col[i*3+1]=0.75+0.25*t; col[i*3+2]=1.0;
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.BufferAttribute(pos,3));
  g.setAttribute('color',new T.BufferAttribute(col,3));
  const m=new T.PointsMaterial({size:size,map:TX_WHITE,vertexColors:true,transparent:true,
    blending:T.AdditiveBlending,depthWrite:false,opacity:.95,sizeAttenuation:true});
  return new T.Points(g,m);
}
const stars1 = buildStars(1400, 18, 42, 0.16); cosmos.add(stars1);
const stars2 = buildStars(500, 12, 26, 0.30); cosmos.add(stars2);

// nebula haze
[[ -3,-2,-12,7,0x21407a,.18],[3,3,-15,9,0x3a2a6b,.14],[0,-4,-9,6,0x123a55,.16]]
.forEach(([x,y,z,s,c,o])=>{ const sp=glowSprite(glowTexture(
  'rgba(120,150,230,'+o+')','rgba(60,80,160,0)'),s,c); sp.position.set(x,y,z);
  sp.material.opacity=o*4; cosmos.add(sp); });

// astrolabe / radar / neural rings behind figure
const astro = new T.Group(); astro.position.set(0,0.4,-3.2); cosmos.add(astro);
function ringLine(rad, seg, mat, dash){
  const pts=[]; for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2; pts.push(V(Math.cos(a)*rad,Math.sin(a)*rad,0));}
  return new T.Line(new T.BufferGeometry().setFromPoints(pts), mat);
}
const ringMatA=new T.LineBasicMaterial({color:0x2f5f9e,transparent:true,opacity:.5});
const ringMatB=new T.LineBasicMaterial({color:0x49f2d6,transparent:true,opacity:.22,blending:T.AdditiveBlending,depthWrite:false});
const ringMatG=new T.LineBasicMaterial({color:0xb08a3a,transparent:true,opacity:.35});
[3.0,3.05].forEach(r=>astro.add(ringLine(r,128,ringMatG)));
[3.7,4.5].forEach(r=>astro.add(ringLine(r,128,ringMatA)));
astro.add(ringLine(2.4,96,ringMatB));
// tick marks (astrolabe graduations)
const tickG=new T.BufferGeometry(); const tp=[];
for(let i=0;i<72;i++){const a=i/72*Math.PI*2; const r0=(i%6===0)?3.85:3.95;
  tp.push(Math.cos(a)*r0,Math.sin(a)*r0,0, Math.cos(a)*4.1,Math.sin(a)*4.1,0);}
tickG.setAttribute('position',new T.Float32BufferAttribute(tp,3));
astro.add(new T.LineSegments(tickG, ringMatA));
// inner neural/radial spokes + nodes
const spokeG=new T.BufferGeometry(); const sp2=[];
for(let i=0;i<12;i++){const a=i/12*Math.PI*2; sp2.push(0,0,0, Math.cos(a)*2.4,Math.sin(a)*2.4,0);}
spokeG.setAttribute('position',new T.Float32BufferAttribute(sp2,3));
astro.add(new T.LineSegments(spokeG, ringMatB));
// scattered constellation nodes
const constMat=new T.PointsMaterial({size:.12,map:TX_WHITE,color:0xbfe6ff,transparent:true,
  blending:T.AdditiveBlending,depthWrite:false});
const cg=new T.BufferGeometry(); const cnodes=[];
for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2; const r=1.5+Math.random()*3.0;
  cnodes.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-.5)*.4);}
cg.setAttribute('position',new T.Float32BufferAttribute(cnodes,3));
astro.add(new T.Points(cg,constMat));

/* ============================== MOON ============================== */
function buildMoon(){
  const g=new T.Group();
  const shape=new T.Shape(); shape.absarc(0,0,1,0,Math.PI*2,false);
  const hole=new T.Path(); hole.absarc(0.42,0.12,0.86,0,Math.PI*2,true);
  shape.holes.push(hole);
  const geo=new T.ExtrudeGeometry(shape,{depth:0.12,bevelEnabled:true,bevelThickness:0.04,
    bevelSize:0.04,bevelSegments:2,steps:1});
  geo.center();
  const moon=new T.Mesh(geo, new T.MeshStandardMaterial({color:COL.moon,emissive:0x6b5424,
    emissiveIntensity:.7,roughness:.45,metalness:.6}));
  moon.scale.setScalar(0.72); moon.rotation.z=-0.5; g.add(moon);
  const halo=glowSprite(TX_GOLD,3.4,0xf0d79a); halo.material.opacity=.5; g.add(halo);
  g.position.set(-2.25,3.45,-0.6); return g;
}
stage.add(buildMoon());

/* ============================== COLUMNS ============================== */
function fluteLines(radius, h, n){
  const g=new T.BufferGeometry(); const p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2; const x=Math.cos(a)*radius, z=Math.sin(a)*radius;
    p.push(x,0,z, x,h,z);}
  g.setAttribute('position',new T.Float32BufferAttribute(p,3));
  return new T.LineSegments(g,new T.LineBasicMaterial({color:0x33507e}));
}
function spiralVolute(){
  const pts=[]; let r=0.02, a=0;
  for(let i=0;i<70;i++){ a+=0.42; r*=1.072; pts.push(V(Math.cos(a)*r,Math.sin(a)*r,0)); }
  const curve=new T.CatmullRomCurve3(pts);
  const geo=new T.TubeGeometry(curve,70,0.022,6,false);
  return new T.Mesh(geo, matGold);
}
function buildColumn(side){ // side -1 left, +1 right
  const g=new T.Group();
  const shaftH=5.0, rad=0.42;
  // plinth + base
  const plinth=new T.Mesh(new T.BoxGeometry(1.5,0.4,1.5), matStoneDk); plinth.position.y=-3.7; g.add(plinth);
  const base=new T.Mesh(new T.CylinderGeometry(0.62,0.7,0.45,24), matStone); base.position.y=-3.4; g.add(base);
  const torusBase=new T.Mesh(new T.TorusGeometry(0.55,0.1,12,32), matStone);
  torusBase.rotation.x=Math.PI/2; torusBase.position.y=-3.18; g.add(torusBase);
  // fluted shaft
  const shaft=new T.Mesh(new T.CylinderGeometry(rad,rad*1.06,shaftH,28,1,false),
    new T.MeshStandardMaterial({color:0x18293f,roughness:.55,metalness:.55,
      emissive:0x0b1626,emissiveIntensity:.4,flatShading:true}));
  shaft.position.y=-0.6; g.add(shaft);
  // flute accent lines
  const fl=fluteLines(rad*0.99, shaftH, 24); fl.position.y=-3.1;
  fl.material.color.setHex(0x33507e); fl.material.transparent=true; fl.material.opacity=.45; g.add(fl);
  // gold capital band
  const band=new T.Mesh(new T.CylinderGeometry(rad*1.04,rad*1.04,0.12,28), matGold);
  band.position.y=1.95; g.add(band);
  // echinus + abacus (capital block)
  const echinus=new T.Mesh(new T.CylinderGeometry(0.6,0.46,0.28,24), matStone);
  echinus.position.y=2.16; g.add(echinus);
  const abacus=new T.Mesh(new T.BoxGeometry(1.5,0.22,0.7), matStone); abacus.position.y=2.4; g.add(abacus);
  // volutes (Ionic scrolls) front pair
  [-0.55,0.55].forEach(vx=>{ const v=spiralVolute(); v.scale.setScalar(0.85);
    v.position.set(vx,2.28,0.36); if(vx>0) v.scale.x*=-1; g.add(v); });
  const eyeMat=matGoldGlow;
  [-0.55,0.55].forEach(vx=>{ const e=glowSprite(TX_GOLD,0.3,0xe7c878); e.position.set(vx,2.28,0.4);
    e.material.opacity=.7; g.add(e); });
  g.position.set(side*5.25,0,-0.4);
  return g;
}
stage.add(buildColumn(-1));
stage.add(buildColumn(1));

/* ===================== ENTABLATURE + PEDIMENT ===================== */
function buildArch(){
  const g=new T.Group();
  // architrave beam across the top
  const beam=new T.Mesh(new T.BoxGeometry(11.6,0.5,0.6), matStone); beam.position.set(0,2.7,-0.4); g.add(beam);
  const beamG=new T.Mesh(new T.BoxGeometry(11.6,0.08,0.62), matGold); beamG.position.set(0,2.46,-0.4); g.add(beamG);
  // pediment triangle (outline tubes)
  const apex=V(0,5.1,-0.4), bl=V(-5.5,2.95,-0.4), br=V(5.5,2.95,-0.4);
  [[bl,apex],[apex,br],[bl,br]].forEach(([a,b])=>{
    const dir=new T.Vector3().subVectors(b,a); const len=dir.length();
    const geo=new T.CylinderGeometry(0.06,0.06,len,8);
    const m=new T.Mesh(geo,matGold);
    m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize());
    g.add(m);
  });
  // inner pediment fill (subtle dark)
  const tri=new T.Shape(); tri.moveTo(-5.5,0); tri.lineTo(5.5,0); tri.lineTo(0,2.15); tri.closePath();
  const fill=new T.Mesh(new T.ShapeGeometry(tri), matStoneDk);
  fill.position.set(0,2.95,-0.5); g.add(fill);
  // --- intelligence-core SEAL at apex ---
  const seal=new T.Group(); seal.position.set(0,3.55,-0.35);
  const sealRing=new T.Mesh(new T.TorusGeometry(0.34,0.04,12,40), matGold); seal.add(sealRing);
  const medallion=new T.Mesh(new T.CircleGeometry(0.3,40),
    new T.MeshStandardMaterial({color:0x12376b,emissive:0x0a2348,emissiveIntensity:.7,
      roughness:.4,metalness:.5})); medallion.position.z=0.01; seal.add(medallion);
  // crescent inside
  const cs=new T.Shape(); cs.absarc(0,0,0.2,0,Math.PI*2,false);
  const ch=new T.Path(); ch.absarc(0.09,0.02,0.17,0,Math.PI*2,true); cs.holes.push(ch);
  const cres=new T.Mesh(new T.ShapeGeometry(cs), new T.MeshBasicMaterial({color:0xe7c878}));
  cres.position.z=0.02; cres.rotation.z=-0.4; seal.add(cres);
  // 3 orbital dots
  for(let i=0;i<3;i++){const a=i/3*Math.PI*2 - Math.PI/2;
    const d=new T.Mesh(new T.SphereGeometry(0.028,8,8), matGold);
    d.position.set(Math.cos(a)*0.42,Math.sin(a)*0.42,0.02); seal.add(d);
    seal.add(ringLine(0.42,48,ringMatG));
  }
  const sealGlow=glowSprite(TX_GOLD,1.1,0xe7c878); sealGlow.material.opacity=.4; seal.add(sealGlow);
  g.add(seal);
  return g;
}
stage.add(buildArch());

/* ============================== GLOBE ============================== */
function buildGlobe(){
  const g=new T.Group();
  const geo=new T.SphereGeometry(0.62,22,16);
  const wire=new T.Mesh(geo,new T.MeshBasicMaterial({color:0x6fd8ff,wireframe:true,
    transparent:true,opacity:.55,blending:T.AdditiveBlending,depthWrite:false}));
  const skin=new T.Mesh(geo,new T.MeshStandardMaterial({color:0x10324f,emissive:0x0a2540,
    emissiveIntensity:.6,roughness:.5,metalness:.2,transparent:true,opacity:.35}));
  g.add(skin); g.add(wire);
  const halo=glowSprite(TX_CYAN,2.2,0x49f2d6); halo.material.opacity=.3; g.add(halo);
  g.position.set(0,-3.05,0); return {grp:g,wire};
}
const globe=buildGlobe(); stage.add(globe.grp);

/* ============================== FIGURE ============================== */
const figure=new T.Group(); stage.add(figure);

function part(geo,pos,quat,scl){
  const grp=new T.Group();
  const skin=new T.Mesh(geo,FIG_SKIN); const wire=new T.Mesh(geo,FIG_WIRE);
  grp.add(skin); grp.add(wire);
  if(pos)grp.position.copy(pos); if(quat)grp.quaternion.copy(quat); if(scl)grp.scale.copy(scl);
  figure.add(grp); skinMeshes.push(skin); return grp;
}
function limb(p1,p2,r1,r2){
  const dir=new T.Vector3().subVectors(p2,p1); const len=dir.length();
  const geo=new T.CylinderGeometry(r2,r1,len,10,5,true);
  const q=new T.Quaternion().setFromUnitVectors(V(0,1,0),dir.clone().normalize());
  part(geo,new T.Vector3().addVectors(p1,p2).multiplyScalar(.5),q);
}
function joint(p,r){ part(new T.SphereGeometry(r,12,10),p); }

// --- joints (figure faces +X, viewer near +Z) ---
const J={
  head:V(0.18,2.62,0.02), neck:V(0.05,2.18,0.0), chest:V(0.0,1.62,0.0),
  pelvis:V(-0.05,0.05,0.0),
  shF:V(0.05,1.98,0.42),  // bow-arm shoulder (front)
  elF:V(1.15,1.78,0.5), wrF:V(2.05,1.6,0.55),
  shB:V(0.0,1.98,-0.4),  // draw-arm shoulder (back)
  elB:V(-0.25,2.05,-0.85), wrB:V(0.62,1.98,0.18),
  hipR:V(-0.05,0.0,-0.28), knR:V(0.08,-1.45,-0.12), anR:V(0.0,-2.62,0.05),
  hipL:V(-0.05,0.0,0.28), knL:V(0.32,-1.35,0.5), anL:V(0.6,-2.4,0.34)
};

// torso (ellipsoids)
part(new T.SphereGeometry(0.5,20,16), J.chest, null, V(1.05,1.35,0.78)); // ribcage
part(new T.SphereGeometry(0.46,18,14), V(0.0,0.78,0), null, V(0.85,1.1,0.7)); // waist
part(new T.SphereGeometry(0.5,18,14), J.pelvis, null, V(1.0,0.8,0.78)); // pelvis
// subtle classical bust (small spheres)
part(new T.SphereGeometry(0.2,14,12), V(0.34,1.6,0.26));
part(new T.SphereGeometry(0.2,14,12), V(0.3,1.6,-0.22));
// neck + head + bun
limb(J.neck,J.head,0.13,0.16);
part(new T.SphereGeometry(0.34,22,18), J.head, null, V(0.95,1.08,1.0));
part(new T.SphereGeometry(0.2,14,12), V(-0.18,2.78,-0.05)); // hair bun
part(new T.SphereGeometry(0.14,12,10), V(-0.05,2.92,0.05)); // hair top

// arms
limb(J.shF,J.elF,0.16,0.12); limb(J.elF,J.wrF,0.12,0.085);
limb(J.shB,J.elB,0.16,0.12); limb(J.elB,J.wrB,0.12,0.085);
joint(J.shF,0.2); joint(J.elF,0.12); joint(J.shB,0.2); joint(J.elB,0.12);
joint(J.wrF,0.1); joint(J.wrB,0.1);

// legs
limb(J.hipR,J.knR,0.22,0.15); limb(J.knR,J.anR,0.15,0.09);
limb(J.hipL,J.knL,0.22,0.15); limb(J.knL,J.anL,0.15,0.09);
joint(J.knR,0.14); joint(J.knL,0.14); joint(J.anR,0.1); joint(J.anL,0.1);
// feet
limb(J.anR,V(0.32,-2.78,0.05),0.09,0.05); // standing foot on globe
limb(J.anL,V(0.85,-2.5,0.4),0.09,0.05);   // pointed trailing foot

// figure glow
const figHalo=glowSprite(TX_WHITE,5.5,0x6fb6e6); figHalo.material.opacity=.16;
figHalo.position.set(0,0.4,0); figure.add(figHalo);

/* ============================== BOW ============================== */
const bow=new T.Group(); stage.add(bow);
const G=J.wrF.clone(); // grip
function tube(curve,r,mat,seg){return new T.Mesh(new T.TubeGeometry(curve,seg||40,r,8,false),mat);}
// upper & lower limbs (C-curve opening toward -X / archer)
const upper=new T.QuadraticBezierCurve3(V(0,0,0),V(0.15,0.7,0),V(-0.18,1.25,0));
const lower=new T.QuadraticBezierCurve3(V(0,0,0),V(0.15,-0.75,0),V(-0.22,-1.3,0));
const upperM=tube(upper,0.05,matCyan); const lowerM=tube(lower,0.05,matCyan);
bow.add(upperM); bow.add(lowerM);
// riser (central handle)
const riser=new T.Mesh(new T.BoxGeometry(0.12,0.55,0.14), matCyan); bow.add(riser);
// cams at limb tips
const camTop=new T.Mesh(new T.TorusGeometry(0.13,0.04,10,24), matCyan); camTop.position.set(-0.18,1.25,0); bow.add(camTop);
const camBot=new T.Mesh(new T.TorusGeometry(0.13,0.04,10,24), matCyan); camBot.position.set(-0.22,-1.3,0); bow.add(camBot);
// sight / electronics modules (accent boxes from poster)
const mod1=new T.Mesh(new T.BoxGeometry(0.34,0.14,0.05),
  new T.MeshStandardMaterial({color:0x123b3b,emissive:0x35e0ff,emissiveIntensity:.8,roughness:.4}));
mod1.position.set(0.32,0.15,0.06); bow.add(mod1);
const mod2=new T.Mesh(new T.BoxGeometry(0.2,0.1,0.05),
  new T.MeshStandardMaterial({color:0x123b3b,emissive:0x49f2d6,emissiveIntensity:.8,roughness:.4}));
mod2.position.set(0.28,-0.25,0.06); bow.add(mod2);
// position/orient whole bow at grip, tilt slightly
bow.position.copy(G); bow.rotation.z=0.12; bow.scale.setScalar(1.02);
const bowHalo=glowSprite(TX_CYAN,3.2,0x49f2d6); bowHalo.material.opacity=.35; bow.add(bowHalo);

// bowstring: top cam -> draw hand -> bottom cam (world coords)
const camTopW=camTop.position.clone().applyEuler(bow.rotation).add(G);
const camBotW=camBot.position.clone().applyEuler(bow.rotation).add(G);
const stringPts=[camTopW, J.wrB.clone(), camBotW];
const stringGeo=new T.BufferGeometry().setFromPoints(stringPts);
const bowstring=new T.Line(stringGeo, lineCyan); stage.add(bowstring);
// string nodes
[camTopW,camBotW,J.wrB].forEach(p=>{const n=glowSprite(TX_CYAN,0.35,0x49f2d6);
  n.position.copy(p); n.material.opacity=.8; stage.add(n);});

/* ============================== ENERGY ARROW ====================== */
const beam=new T.Group(); stage.add(beam);
const dir=new T.Vector3().subVectors(G,J.wrB).normalize(); // shooting direction
const start=G.clone().add(dir.clone().multiplyScalar(0.25));
const beamLen=6.2;
const beamQ=new T.Quaternion().setFromUnitVectors(V(0,1,0),dir);
function beamCyl(r,op,col){
  const m=new T.Mesh(new T.CylinderGeometry(r,r,beamLen,12,1,true),
    new T.MeshBasicMaterial({color:col,transparent:true,opacity:op,
      blending:T.AdditiveBlending,depthWrite:false}));
  m.quaternion.copy(beamQ);
  m.position.copy(start).add(dir.clone().multiplyScalar(beamLen/2));
  beam.add(m); return m;
}
const beamCore=beamCyl(0.025,0.95,0xeafcff);
const beamMid =beamCyl(0.07,0.5,0x49f2d6);
const beamOut =beamCyl(0.16,0.22,0x35e0ff);
// nock flare + tip flare
const nock=glowSprite(TX_CYAN,0.7,0x9ffff0); nock.position.copy(start); beam.add(nock);
const tip=glowSprite(TX_CYAN,1.4,0xbffff5); tip.position.copy(start).add(dir.clone().multiplyScalar(beamLen)); beam.add(tip);
// travelling particles
const sparks=[];
for(let i=0;i<7;i++){ const s=glowSprite(TX_WHITE,0.28,0xcffcff);
  s.userData.t=Math.random(); beam.add(s); sparks.push(s); }

/* ===================== BASE LEDGE + MEANDER + PLAQUE ============== */
function meanderTexture(){
  const c=document.createElement('canvas'); c.width=2048; c.height=128;
  const g=c.getContext('2d'); g.clearRect(0,0,2048,128);
  g.strokeStyle='#d9b25e'; g.lineWidth=7; g.lineJoin='miter'; g.lineCap='square';
  g.shadowColor='rgba(217,178,94,.6)'; g.shadowBlur=6;
  const u=64, y0=20, y1=108; // greek key cell
  for(let x=-u;x<2048+u;x+=u*2){
    g.beginPath();
    g.moveTo(x,y1); g.lineTo(x,y0+u*0.5); g.lineTo(x+u*1.5,y0+u*0.5);
    g.lineTo(x+u*1.5,y1-14); g.lineTo(x+u*0.5,y1-14); g.lineTo(x+u*0.5,y0+u);
    g.stroke();
  }
  // baseline rails
  g.shadowBlur=0; g.lineWidth=4; g.strokeStyle='rgba(217,178,94,.55)';
  g.beginPath(); g.moveTo(0,12); g.lineTo(2048,12); g.stroke();
  g.beginPath(); g.moveTo(0,118); g.lineTo(2048,118); g.stroke();
  // circuit-trace transition at both ends
  g.strokeStyle='#49f2d6'; g.fillStyle='#49f2d6'; g.lineWidth=3; g.shadowColor='rgba(73,242,214,.7)'; g.shadowBlur=6;
  [[0,1],[2048,-1]].forEach(([ex,dx])=>{
    for(let i=0;i<5;i++){ const x=ex+dx*(20+i*34); const y=24+i*18;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+dx*26,y); g.lineTo(x+dx*26,y+22); g.stroke();
      g.beginPath(); g.arc(x+dx*26,y+22,4,0,Math.PI*2); g.fill(); }
  });
  const t=new T.CanvasTexture(c); t.needsUpdate=true; t.anisotropy=8; return t;
}
function buildBase(){
  const g=new T.Group();
  const ledge=new T.Mesh(new T.BoxGeometry(11.8,0.7,1.4),
    new T.MeshStandardMaterial({color:0x101f3a,roughness:.6,metalness:.5,
      emissive:0x081326,emissiveIntensity:.4}));
  ledge.position.set(0,-3.95,0); g.add(ledge);
  const meanderPlane=new T.Mesh(new T.PlaneGeometry(11.6,0.62),
    new T.MeshBasicMaterial({map:meanderTexture(),transparent:true}));
  meanderPlane.position.set(0,-3.95,0.71); g.add(meanderPlane);
  // top rail gold
  const rail=new T.Mesh(new T.BoxGeometry(11.8,0.05,1.42), matGold); rail.position.set(0,-3.58,0); g.add(rail);
  return g;
}
stage.add(buildBase());

function plaqueTexture(){
  const c=document.createElement('canvas'); c.width=1536; c.height=640;
  const g=c.getContext('2d');
  // sapphire enamel
  const bg=g.createLinearGradient(0,0,0,640);
  bg.addColorStop(0,'#13284e'); bg.addColorStop(.5,'#0d1d3c'); bg.addColorStop(1,'#0a1530');
  g.fillStyle=bg; roundRect(g,12,12,1512,616,28); g.fill();
  // engraved gold borders
  g.strokeStyle='rgba(217,178,94,.85)'; g.lineWidth=6; roundRect(g,30,30,1476,580,22); g.stroke();
  g.strokeStyle='rgba(217,178,94,.4)'; g.lineWidth=2; roundRect(g,48,48,1440,544,16); g.stroke();
  drawText(g);
  const t=new T.CanvasTexture(c); t.needsUpdate=true; t.anisotropy=8; return t;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawText(g){
  g.textAlign='center'; g.textBaseline='middle';
  // ARTEMIS
  const grd=g.createLinearGradient(0,210,0,400);
  grd.addColorStop(0,'#f8ecc4'); grd.addColorStop(.5,'#d9b25e'); grd.addColorStop(1,'#8a6a2f');
  g.fillStyle=grd; g.shadowColor='rgba(217,178,94,.45)'; g.shadowBlur=24;
  g.font='700 188px Cinzel, serif';
  g.fillText('ARTEMIS',768,300);
  // INTELLIGENT SYSTEMS
  g.shadowBlur=10; g.fillStyle='#c9b985'; g.font='600 70px Cinzel, serif';
  g.fillText('I N T E L L I G E N T   S Y S T E M S',768,470);
  // divider
  g.shadowBlur=0; g.strokeStyle='rgba(217,178,94,.5)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(440,400); g.lineTo(1096,400); g.stroke();
  [440,1096].forEach(x=>{g.fillStyle='#d9b25e';g.beginPath();g.arc(x,400,6,0,Math.PI*2);g.fill();});
}
const plaqueMat=new T.MeshStandardMaterial({roughness:.45,metalness:.3,
  emissive:0xffffff,emissiveIntensity:.18});
function makePlaque(){
  const tex=plaqueTexture();
  plaqueMat.map=tex; plaqueMat.emissiveMap=tex; plaqueMat.needsUpdate=true;
  const p=new T.Mesh(new T.PlaneGeometry(8.4,3.5), plaqueMat);
  p.position.set(0,-5.7,0.2); return p;
}
const plaque=makePlaque(); stage.add(plaque);
// redraw plaque + meander once fonts are ready (for Cinzel)
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ plaqueMat.map=plaqueTexture(); plaqueMat.emissiveMap=plaqueMat.map;
    plaqueMat.map.needsUpdate=true; plaqueMat.needsUpdate=true; });
}

/* ============================== CONTROLS ============================ */
const target=V(0,-0.8,0);
let radius=16.8, theta=0, phi=Math.PI*0.5, autoRotate=true;
let dragging=false, lx=0, ly=0, idleTimer=0;
function applyCam(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
const el=renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;autoRotate=false;}
function move(x,y){ if(!dragging)return; const dx=(x-lx)/innerWidth, dy=(y-ly)/innerHeight;
  theta-=dx*3.0; phi=Math.max(0.25,Math.min(Math.PI-0.25,phi-dy*2.2)); lx=x;ly=y; }
function up(){dragging=false; idleTimer=0;}
el.addEventListener('pointerdown',e=>down(e.clientX,e.clientY));
addEventListener('pointermove',e=>move(e.clientX,e.clientY));
addEventListener('pointerup',up);
el.addEventListener('wheel',e=>{e.preventDefault();
  radius=Math.max(8,Math.min(30,radius+e.deltaY*0.012));},{passive:false});
// pinch
let pinch=0;
el.addEventListener('touchmove',e=>{ if(e.touches.length===2){ e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)radius=Math.max(8,Math.min(30,radius+(pinch-d)*0.03)); pinch=d; } },{passive:false});
el.addEventListener('touchend',()=>pinch=0);

/* ============================== UI ============================== */
const btn=id=>document.getElementById(id);
function toggle(id,fn){ const b=btn(id); b.addEventListener('click',()=>{
  b.classList.toggle('on'); fn(b.classList.contains('on')); }); }
toggle('b-rotate',v=>{autoRotate=v;});
toggle('b-beam',v=>{beam.visible=v; bowstring.visible=v;});
toggle('b-marble',v=>{skinMeshes.forEach(m=>m.visible=v); globe.grp.children[0].visible=v;});
toggle('b-stars',v=>{cosmos.visible=v;});
btn('b-front').addEventListener('click',()=>{theta=0;phi=Math.PI*0.5;radius=16.8;autoRotate=false;
  btn('b-rotate').classList.remove('on');});
btn('b-reset').addEventListener('click',()=>{theta=0;phi=Math.PI*0.5;radius=16.8;autoRotate=true;
  btn('b-rotate').classList.add('on');});

/* ============================== ANIMATE ============================ */
let tprev=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-tprev)/1000); tprev=now;
  const t=now*0.001;
  if(!dragging){ idleTimer+=dt; if(idleTimer>3 && !autoRotate && btn('b-rotate').classList.contains('on')) autoRotate=true; }
  if(autoRotate) theta+=dt*0.18;
  applyCam();

  // astrolabe slow counter-rotation
  astro.rotation.z+=dt*0.04;
  // moonlight + bow shimmer
  bowLight.intensity=0.8+Math.sin(t*3)*0.25;
  // beam pulse
  const pulse=0.78+Math.sin(t*6)*0.22;
  beamCore.material.opacity=0.95*pulse; beamMid.material.opacity=0.5*pulse;
  beamOut.material.opacity=0.22*pulse; tip.material.opacity=0.9*pulse;
  tip.scale.setScalar(1.4*(0.9+0.2*Math.sin(t*8)));
  // travelling sparks along beam
  sparks.forEach((s,i)=>{ s.userData.t=(s.userData.t+dt*0.6)%1;
    s.position.copy(start).add(dir.clone().multiplyScalar(beamLen*s.userData.t));
    s.material.opacity=0.9*(1-s.userData.t)*pulse; });
  // gentle figure breathing glow
  FIG_WIRE.opacity=0.45+Math.sin(t*1.5)*0.08;
  figHalo.material.opacity=0.14+Math.sin(t*1.2)*0.04;
  // twinkle
  stars2.material.opacity=0.7+Math.sin(t*2)*0.25;

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

/* ============================== RESIZE ============================ */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

/* fit framing on small/portrait screens */
function fit(){ const portrait=innerHeight>innerWidth; radius=portrait?23:16.8; }
fit();

/* hide loader */
setTimeout(()=>document.getElementById('loader').classList.add('hide'),650);
</script>
