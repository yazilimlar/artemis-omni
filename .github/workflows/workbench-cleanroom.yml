name: Workbench Clean-Room

on:
  pull_request:
    paths:
      - "artemis-workbench/**"
      - ".github/workflows/workbench-cleanroom.yml"
  push:
    branches:
      - main
    paths:
      - "artemis-workbench/**"
      - ".github/workflows/workbench-cleanroom.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root toolchain
        run: npm ci
      - name: Typecheck clean-room foundation
        run: npx tsc --noEmit -p artemis-workbench/tsconfig.json
      - name: Test clean-room foundation
        shell: bash
        run: |
          set -o pipefail
          npx vitest run artemis-workbench/tests 2>&1 | tee artemis-workbench/vitest.log
      - name: Upload clean-room test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-cleanroom-vitest
          path: artemis-workbench/vitest.log
          if-no-files-found: error
