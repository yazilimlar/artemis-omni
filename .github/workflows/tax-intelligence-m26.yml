name: Tax Intelligence M2.6 Validation
on:
  push:
    branches: [feature/tax-intelligence-client-app-r1]
    paths:
      - "lib/tax-intelligence/**"
      - "app/apps/tax-intelligence/**"
      - "docs/tax-intelligence/**"
      - ".github/workflows/tax-intelligence-m26.yml"
  pull_request:
    paths:
      - "lib/tax-intelligence/**"
      - "app/apps/tax-intelligence/**"
      - "docs/tax-intelligence/**"
      - ".github/workflows/tax-intelligence-m26.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Environment diagnostics (no secrets)
        run: |
          node --version
          npm --version
          test -f package-lock.json
          git rev-parse --short HEAD
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tax intelligence unit tests
        run: npx vitest run lib/tax-intelligence --reporter=verbose
      - name: TypeScript validation
        run: npm run typecheck
