    name: ArtemisIX19
    route: /labs/artemisix19
    canonical_branch: main
    historical_branch: feature/artemisix19-autonomous-generator
    state: inventory_required
    product_role: cross_division_capability_donor
    retirement_allowed: false
    capabilities:
