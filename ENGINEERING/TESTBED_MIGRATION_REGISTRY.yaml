schema_version: 1
registry_status: active
last_reviewed: 2026-07-10

disposition_definitions:
  - review_required
  - migrate
  - repair_then_migrate
  - retain_as_test_fixture
  - reject
  - archive_after_evidence

rules:
  - A testbed is not automatically a permanent product.
  - Working capabilities may migrate into different divisions or products.
  - Do not delete or retire a testbed until every verified capability has a recorded disposition.
  - Migration must originate from a fresh main-based branch and use selective extraction.
  - A migrated capability must record its target path, validation evidence, and source provenance.
  - Broken, duplicate, or misleading behavior must not be migrated merely to preserve branch content.

