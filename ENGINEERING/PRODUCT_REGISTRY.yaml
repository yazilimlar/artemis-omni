# ---------------------------------------------------------------------------
# 2026-10-01 registry sync (branch governance/registry-sync-2026-10)
# Source: docs/history/phase-1-inventory-proposal.md (PR #67)
#
# UNREVIEWED is used as a field value where division, family, lifecycle,
# maturity, visibility, data mode or canonical route is not established by
# repository evidence or an owner decision (AI_AGENT_RULES.md: "Use UNREVIEWED
# or propose registry correction rather than guessing"). It is a review marker,
# not a member of any status_definitions list.
#
# Owner classifications are recorded as `# owner:` comments on each entry,
# because the current schema has no fields for them.
#
# PROPOSED schema additions (NOT applied; for a later governance PR):
#   subclass:                  variant within a bucket
#                              (demo | reference_demo | placeholder_persona | personal_demo)
#   external_brand_referenced: third-party brand an artifact references but does not own
#   operator:                  organization that runs the product
#   end_customer:              who the product ultimately serves
#   bucket:                    internal_product | internal_asset | client_or_owner_related
#   data_boundary:             artemis_owned | to_be_confirmed
#   publication:               owner publication intent (public | noindex | mixed)
#   distribution:              delivery channel when the product is not a route
#   observed_routes:           every delivery surface when more than one exists
#
# 2026-10-01 refinement (branch governance/registry-refinement-2026-10):
# bucket, subclass, operator and end_customer are now applied on selected entries
# per ADR-008 and ADR-009. The other fields above remain proposals.
# ---------------------------------------------------------------------------

