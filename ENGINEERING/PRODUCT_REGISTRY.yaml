registry_rules:
  - A branch status must never be used as the sole evidence for product retirement.
  - A public route must declare maturity, visibility, and data mode.
  - A product may have multiple donor branches but only one canonical implementation.
  - A donor branch must be selectively reviewed; branch-wide merges are not implied.
  - New major products require a Product Registry entry and feature passport before production.
